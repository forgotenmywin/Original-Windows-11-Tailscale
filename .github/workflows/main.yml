name: Pure RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP Service & User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          $runnerAdminPass = "WindowsRDP#2025"
          net user "runneradmin" $runnerAdminPass
          echo "RDP_USER=runneradmin" >> $env:GITHUB_ENV
          echo "RDP_PASS=$runnerAdminPass" >> $env:GITHUB_ENV
          
      - name: Install and Configure OpenSSH & WinRM
        shell: powershell
        run: |
          Write-Host "========== Installing OpenSSH Server =========="
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (SSH)' -Enabled True -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow -ErrorAction SilentlyContinue
          
          Write-Host "========== Configuring WinRM (PSRemoting) =========="
          # Enable WinRM
          Enable-PSRemoting -Force
          
          # ---------- Service settings ----------
          Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true -Force
          Set-Item WSMan:\localhost\Service\AllowUnencrypted -Value $true -Force
          
          # ---------- Client settings ----------
          Set-Item WSMan:\localhost\Client\Auth\Basic -Value $true -Force
          Set-Item WSMan:\localhost\Client\AllowUnencrypted -Value $true -Force
          Set-Item WSMan:\localhost\Client\TrustedHosts -Value "*" -Force
          
          # Enable HTTP listener (if exists)
          if (Test-Path WSMan:\localhost\Service\EnableCompatibilityHttpListener) {
            Set-Item WSMan:\localhost\Service\EnableCompatibilityHttpListener -Value $true -Force
          }
          
          # Firewall rules
          New-NetFirewallRule -Name 'WinRM-HTTP-In-TCP' -DisplayName 'WinRM HTTP' -Enabled True -Direction Inbound -Protocol TCP -LocalPort 5985 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -Name 'WinRM-HTTPS-In-TCP' -DisplayName 'WinRM HTTPS' -Enabled True -Direction Inbound -Protocol TCP -LocalPort 5986 -Action Allow -ErrorAction SilentlyContinue
          
          # Add user to WinRM group
          Add-LocalGroupMember -Group "WinRMRemoteWMIUsers__" -Member "runneradmin" -ErrorAction SilentlyContinue
          
          # Restart WinRM
          Restart-Service WinRM -Force
          
          # ---------- Test WinRM locally (correct syntax) ----------
          Write-Host "Testing WinRM locally..."
          $cred = New-Object System.Management.Automation.PSCredential("runneradmin", (ConvertTo-SecureString "WindowsRDP#2025" -AsPlainText -Force))
          $sessionOption = New-PSSessionOption -SkipCACheck -SkipCNCheck -SkipRevocationCheck
          $session = New-PSSession -ComputerName "127.0.0.1" -Credential $cred -SessionOption $sessionOption -Authentication Basic -ErrorAction Stop
          Remove-PSSession $session
          Write-Host "✅ WinRM test successful!"
          
          Write-Host "SSH and WinRM setup completed successfully!"

      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/S" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          for ($i=1; $i -le 15; $i++){ 
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if($tsIP){break}
            Start-Sleep 4 
          }
          if (-not $tsIP) { 
            exit 1 
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Connection Details and Keep Alive
        shell: powershell
        run: |
          Write-Host "================ CONNECTION DETAILS ================"
          Write-Host "IP Address   : ${{ env.TAILSCALE_IP }}"
          Write-Host "Username     : ${{ env.RDP_USER }}"
          Write-Host "Password     : ${{ env.RDP_PASS }}"
          Write-Host "===================================================="
          Write-Host ""
          Write-Host "[1] RDP (Remote Desktop):"
          Write-Host "    Address: ${{ env.TAILSCALE_IP }}:3389"
          Write-Host ""
          Write-Host "[2] SSH (Command Line / Putty):"
          Write-Host "    ssh ${{ env.RDP_USER }}@${{ env.TAILSCALE_IP }}"
          Write-Host "    (When prompted, enter password: ${{ env.RDP_PASS }})"
          Write-Host ""
          Write-Host "[3] WinRM (PowerShell Remoting):"
          Write-Host "    On Windows/Linux with PowerShell Core:"
          Write-Host "    Enter-PSSession -ComputerName ${{ env.TAILSCALE_IP }} -Credential ${{ env.RDP_USER }} -Authentication Basic -AllowRedirection"
          Write-Host ""
          Write-Host "    On Linux/macOS with evil-winrm:"
          Write-Host "    evil-winrm -i ${{ env.TAILSCALE_IP }} -u ${{ env.RDP_USER }} -p '${{ env.RDP_PASS }}'"
          Write-Host ""
          Write-Host "============ SESSION WILL STAY ALIVE FOR 6 HOURS ============"
          while ($true) {
            Start-Sleep 300
          }
