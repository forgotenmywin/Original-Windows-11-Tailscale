name: Windows 11 - RDP + Tailscale + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Configuring Remote Desktop"
          Write-Host "============================================"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          $existing = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser `
              -Name $Username `
              -Password (ConvertTo-SecureString $Password -AsPlainText -Force)

            Write-Host "Existing user password updated."
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password (ConvertTo-SecureString $Password -AsPlainText -Force) `
              -PasswordNeverExpires `
              -AccountNeverExpires

            Write-Host "Created $Username."
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          echo "RDP_USER=$Username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. Tailscale
      #
      # IMPORTANT:
      # If your OAuth client uses tag:ci, create that tag in Tailscale.
      # ============================================================
      - name: Connect Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENTID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:ci

      # ============================================================
      # 3. Show Tailscale status
      # ============================================================
      - name: Check Tailscale
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "Checking Tailscale"
          Write-Host "============================================"

          $ts = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if ($ts) {

            Write-Host "Tailscale executable found."

            try {
              tailscale status

              Write-Host ""
              Write-Host "Tailscale IPv4:"
              tailscale ip -4
            }
            catch {
              Write-Host "Tailscale is not connected."
              Write-Host "noVNC will still continue."
            }

          }
          else {
            Write-Host "Tailscale executable not found."
            Write-Host "Continuing with noVNC."
          }

      # ============================================================
      # 4. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing TightVNC"
          Write-Host "============================================"

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "TightVNC installer was not downloaded."
          }

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart",
              "ADDLOCAL=Server"
            ) `
            -Wait `
            -NoNewWindow

          Write-Host "TightVNC installation finished."

      # ============================================================
      # 5. Configure and start TightVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $vnc = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            throw "TightVNC server not found: $vnc"
          }

          # Install the service if necessary
          & $vnc -install -silent 2>$null

          Start-Sleep -Seconds 3

          # Start the service
          & $vnc -start 2>$null

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "Service status: $($service.Status)"

            if ($service.Status -ne "Running") {
              Start-Service -Name "tvnserver"
              Start-Sleep -Seconds 3
            }
          }

          Write-Host ""
          Write-Host "TightVNC processes:"
          Get-Process | Where-Object {
            $_.ProcessName -match "tvn|vnc"
          } | Format-Table -AutoSize

      # ============================================================
      # 6. Verify VNC port
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $success = $false

          for ($i = 1; $i -le 30; $i++) {

            $result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              $success = $true
              Write-Host "VNC is listening on 127.0.0.1:5900"
              break
            }

            Write-Host "Waiting for VNC... attempt $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$success) {

            Write-Host ""
            Write-Host "VNC service:"
            Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "VNC processes:"
            Get-Process | Where-Object {
              $_.ProcessName -match "tvn|vnc"
            } | Format-Table -AutoSize

            throw "VNC port 5900 is not available."
          }

      # ============================================================
      # 7. Download noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing noVNC"
          Write-Host "============================================"

          $path = "C:\noVNC"

          if (Test-Path $path) {
            Remove-Item $path -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $path

          if (!(Test-Path "$path\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 8. Install websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing websockify"
          Write-Host "============================================"

          $python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$python) {

            Write-Host "Python not found."

            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            Start-Sleep -Seconds 5
          }

          $pythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$pythonCommand) {
            throw "Python was not found."
          }

          $pythonPath = $pythonCommand.Source

          Write-Host "Python: $pythonPath"

          & $pythonPath -m pip install --upgrade pip

          & $pythonPath -m pip install websockify

          $scripts = Split-Path $pythonPath

          $scripts = Join-Path $scripts "Scripts"

          $websockify = Join-Path $scripts "websockify.exe"

          if (!(Test-Path $websockify)) {

            $websockifyCommand = Get-Command websockify.exe -ErrorAction SilentlyContinue

            if ($websockifyCommand) {
              $websockify = $websockifyCommand.Source
            }
            else {
              throw "websockify.exe was not found."
            }
          }

          echo "PYTHON_EXE=$pythonPath" >> $env:GITHUB_ENV
          echo "WEBSOCKIFY_EXE=$websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $websockify"

      # ============================================================
      # 9. Start noVNC / websockify
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting noVNC"
          Write-Host "============================================"

          $noVNC = "C:\noVNC"
          $websockify = $env:WEBSOCKIFY_EXE

          $stdout = "C:\noVNC\websockify-stdout.log"
          $stderr = "C:\noVNC\websockify-stderr.log"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          $arguments = @(
            "--web",
            $noVNC,
            "6080",
            "127.0.0.1:5900"
          )

          Write-Host "Command:"
          Write-Host "$websockify --web $noVNC 6080 127.0.0.1:5900"

          Start-Process `
            -FilePath $websockify `
            -ArgumentList $arguments `
            -WorkingDirectory $noVNC `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $success = $false

          for ($i = 1; $i -le 30; $i++) {

            $result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              $success = $true
              Write-Host "noVNC is listening on 127.0.0.1:6080"
              break
            }

            Write-Host "Waiting for noVNC... attempt $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$success) {

            Write-Host ""
            Write-Host "========== websockify stdout =========="
            Get-Content $stdout -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "========== websockify stderr =========="
            Get-Content $stderr -ErrorAction SilentlyContinue

            throw "noVNC/websockify failed to start."
          }

      # ============================================================
      # 10. Install cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing cloudflared"
          Write-Host "============================================"

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "cloudflared download failed."
          }

          Write-Host "cloudflared installed."

      # ============================================================
      # 11. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"

          $stdout = "C:\cloudflared-stdout.log"
          $stderr = "C:\cloudflared-stderr.log"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          Write-Host "Target: http://127.0.0.1:6080"

          Start-Process `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "Waiting for Cloudflare URL..."

          $url = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            $content = ""

            if (Test-Path $stdout) {
              $content += "`n" + (
                Get-Content $stdout -Raw -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $stderr) {
              $content += "`n" + (
                Get-Content $stderr -Raw -ErrorAction SilentlyContinue
              )
            }

            $match = [regex]::Match(
              $content,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $url = $match.Value
              break
            }

            Write-Host "Waiting... $i/60"
          }

          if (!$url) {

            Write-Host ""
            Write-Host "========== cloudflared stdout =========="
            Get-Content $stdout -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "========== cloudflared stderr =========="
            Get-Content $stderr -ErrorAction SilentlyContinue

            throw "Cloudflare Quick Tunnel URL was not found."
          }

          $novncUrl = "$url/vnc.html?autoconnect=true&resize=scale"

          echo "CLOUDFLARE_URL=$url" >> $env:GITHUB_ENV
          echo "NOVNC_URL=$novncUrl" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL IN YOUR BROWSER:"
          Write-Host ""
          Write-Host $novncUrl
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 12. Final connection information
      # ============================================================
      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 WINDOWS 11 READY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "-------------------- noVNC --------------------"
          Write-Host ""
          Write-Host $env:NOVNC_URL
          Write-Host ""

          Write-Host "--------------------- RDP ---------------------"
          Write-Host ""
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASSWORD"

          try {
            $tsIp = tailscale ip -4

            Write-Host ""
            Write-Host "Tailscale IP:"
            Write-Host $tsIp
          }
          catch {
            Write-Host ""
            Write-Host "Tailscale IP unavailable."
          }

          Write-Host ""
          Write-Host "VNC       : 127.0.0.1:5900"
          Write-Host "noVNC     : 127.0.0.1:6080"
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "The browser URL above is your noVNC Windows desktop."
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 13. Keep runner alive
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             SESSION IS NOW RUNNING"
          Write-Host "============================================================"
          Write-Host ""

          while ($true) {

            $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$time] Windows + noVNC session alive..."

            Start-Sleep -Seconds 300
          }
