name: Windows 11 - RDP + noVNC + Cloudflare

"on":
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          $Existing = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($Existing) {
            Set-LocalUser -Name $Username -Password $SecurePassword
          }
          else {
            New-LocalUser -Name $Username -Password $SecurePassword -PasswordNeverExpires -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      - name: Download TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
            throw "TightVNC installer was not downloaded."
          }

          Write-Host "TightVNC downloaded."

      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tightvnc.msi"

          # Maximum 8 characters for TightVNC password
          $VncPassword = "MyVNC123"

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($Process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installed."

      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
            throw "TightVNC executable not found."
          }

          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 2

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue

          if ($Service -and $Service.Status -ne "Running") {
            Start-Service -Name "tvnserver" -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }

          Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Verify VNC
        shell: powershell
        run: |
          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {
            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              Write-Host "VNC is listening on 127.0.0.1:5900"
              $Ready = $true
              break
            }

            Write-Host "Waiting for VNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {
            throw "VNC server is not listening on port 5900."
          }

      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
            Remove-Item $NoVncPath -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            Start-Sleep -Seconds 5
          }

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            throw "Python was not found."
          }

          $PythonPath = $Python.Source

          Write-Host "Python: $PythonPath"

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          $Scripts = Join-Path (Split-Path $PythonPath) "Scripts"
          $Websockify = Join-Path $Scripts "websockify.exe"

          if (!(Test-Path $Websockify)) {
            $W = Get-Command websockify.exe -ErrorAction SilentlyContinue

            if (!$W) {
              throw "websockify.exe was not found."
            }

            $Websockify = $W.Source
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE

          $Stdout = "$NoVncPath\websockify.log"
          $Stderr = "$NoVncPath\websockify-error.log"

          Remove-Item $Stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $Stderr -Force -ErrorAction SilentlyContinue

          # Listen on all local interfaces so cloudflared can reach
          # the runner's actual IPv4 address.
          $Arguments = @(
            "--web"
            $NoVncPath
            "--verbose"
            "0.0.0.0:6080"
            "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath $Websockify `
            -ArgumentList $Arguments `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {
            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              Write-Host "noVNC/websockify is listening on port 6080."
              $Ready = $true
              break
            }

            Write-Host "Waiting for port 6080... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {
            Write-Host "========== websockify stdout =========="
            Get-Content $Stdout -ErrorAction SilentlyContinue

            Write-Host "========== websockify stderr =========="
            Get-Content $Stderr -ErrorAction SilentlyContinue

            throw "websockify did not open port 6080."
          }

          # Find the runner's real IPv4 address.
          $IpConfig = Get-NetIPConfiguration |
            Where-Object {
              $_.IPv4DefaultGateway -and $_.IPv4Address
            } |
            Select-Object -First 1

          if (!$IpConfig) {
            throw "Could not determine runner IPv4 address."
          }

          $LocalIP = $IpConfig.IPv4Address.IPAddress

          "LOCAL_ORIGIN_IP=$LocalIP" >> $env:GITHUB_ENV

          Write-Host "Runner IPv4: $LocalIP"

          # Allow the local HTTP service through Windows Firewall.
          New-NetFirewallRule `
            -DisplayName "Allow noVNC 6080" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 6080 `
            -ErrorAction SilentlyContinue |
            Out-Null

          # Test the origin using the actual IP, not loopback.
          try {
            $Response = Invoke-WebRequest `
              -Uri "http://${LocalIP}:6080/vnc.html" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Local origin HTTP status: $($Response.StatusCode)"

            if ($Response.StatusCode -ne 200) {
              throw "Origin did not return HTTP 200."
            }
          }
          catch {
            Write-Host "========== websockify stdout =========="
            Get-Content $Stdout -ErrorAction SilentlyContinue

            Write-Host "========== websockify stderr =========="
            Get-Content $Stderr -ErrorAction SilentlyContinue

            throw "Local noVNC origin test failed: $($_.Exception.Message)"
          }

          Write-Host "Local noVNC origin is healthy."

      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared `
            -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
            throw "cloudflared download failed."
          }

          & $Cloudflared version

      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"
          $LocalIP = $env:LOCAL_ORIGIN_IP
          $Origin = "http://${LocalIP}:6080"

          $Stdout = "C:\cloudflared-stdout.log"
          $Stderr = "C:\cloudflared-stderr.log"
          $DebugLog = "C:\cloudflared-debug.log"

          Remove-Item $Stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $Stderr -Force -ErrorAction SilentlyContinue
          Remove-Item $DebugLog -Force -ErrorAction SilentlyContinue

          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"
          Write-Host "Origin: $Origin"
          Write-Host ""

          $TunnelProcess = Start-Process `
            -FilePath $Cloudflared `
            -ArgumentList @(
              "tunnel"
              "--no-autoupdate"
              "--protocol"
              "auto"
              "--edge-ip-version"
              "4"
              "--loglevel"
              "debug"
              "--logfile"
              $DebugLog
              "--url"
              $Origin
            ) `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden `
            -PassThru

          $TunnelUrl = $null
          $Registered = $false

          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 2

            if ($TunnelProcess.HasExited) {
              break
            }

            $Content = ""

            if (Test-Path $Stdout) {
              $Content += "`n" + (
                Get-Content $Stdout -Raw -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $Stderr) {
              $Content += "`n" + (
                Get-Content $Stderr -Raw -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $DebugLog) {
              $Content += "`n" + (
                Get-Content $DebugLog -Raw -ErrorAction SilentlyContinue
              )
            }

            if (!$TunnelUrl) {
              $Match = [regex]::Match(
                $Content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($Match.Success) {
                $TunnelUrl = $Match.Value
              }
            }

            if ($Content -match "Registered tunnel connection") {
              $Registered = $true
            }

            if ($TunnelUrl) {
              Write-Host "Tunnel URL: $TunnelUrl"
            }

            if ($Registered) {
              Write-Host "Cloudflare tunnel connection registered."
              break
            }

            Write-Host "Waiting for Cloudflare... $i/90"
          }

          if (!$TunnelUrl) {
            Write-Host "========== cloudflared stdout =========="
            Get-Content $Stdout -ErrorAction SilentlyContinue

            Write-Host "========== cloudflared stderr =========="
            Get-Content $Stderr -ErrorAction SilentlyContinue

            Write-Host "========== cloudflared debug =========="
            Get-Content $DebugLog -Tail 200 -ErrorAction SilentlyContinue

            throw "Cloudflare did not generate a Quick Tunnel URL."
          }

          if (!$Registered) {
            Write-Host "========== cloudflared debug =========="
            Get-Content $DebugLog -Tail 200 -ErrorAction SilentlyContinue

            throw "Cloudflare did not register the tunnel connection."
          }

          $NoVncUrl = "$TunnelUrl/vnc.html"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC password:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "RDP user:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "RDP password:"
          Write-Host "WindowsRDP#2025"
          Write-Host ""
          Write-Host "Origin:"
          Write-Host $Origin
          Write-Host ""
          Write-Host "============================================================"

          # Give the Quick Tunnel a little time to propagate.
          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "Testing public noVNC URL..."

          try {
            $Response = Invoke-WebRequest `
              -Uri $NoVncUrl `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "Public HTTP status: $($Response.StatusCode)"
          }
          catch {
            Write-Host "Public HTTP test failed: $($_.Exception.Message)"
            Write-Host ""
            Write-Host "Cloudflare debug tail:"
            Get-Content $DebugLog -Tail 150 -ErrorAction SilentlyContinue
          }

          while ($true) {
            Start-Sleep -Seconds 30

            if ($TunnelProcess.HasExited) {
              Write-Host "cloudflared stopped."
              Get-Content $DebugLog -Tail 150 -ErrorAction SilentlyContinue
              throw "cloudflared stopped while the Windows session was active."
            }

            $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$Now] Windows + VNC + noVNC + Cloudflare alive."
          }
