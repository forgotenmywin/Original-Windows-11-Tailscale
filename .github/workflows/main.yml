```yaml
name: Windows 11 - RDP + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure Windows RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Configuring Remote Desktop"
          Write-Host "============================================"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Create local administrator
          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          $securePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($existing) {

            Set-LocalUser `
              -Name $Username `
              -Password $securePassword

            Write-Host "Updated existing user."

          } else {

            New-LocalUser `
              -Name $Username `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires

            Write-Host "Created $Username."
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          echo "RDP_USER=$Username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configuration complete."

      # ============================================================
      # 2. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading TightVNC"
          Write-Host "============================================"

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "TightVNC download failed."
          }

          # VNC password must be 8 characters or fewer.
          $vncPassword = "${{ secrets.VNC_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($vncPassword)) {
            throw "VNC_PASSWORD GitHub Secret is missing."
          }

          if ($vncPassword.Length -gt 8) {
            throw "VNC_PASSWORD must be 8 characters or fewer."
          }

          Write-Host "Installing TightVNC..."

          $arguments = @(
            "/i",
            "`"$installer`"",
            "/quiet",
            "/norestart",

            "ADDLOCAL=Server",

            "SERVER_REGISTER_AS_SERVICE=1",
            "SERVER_ADD_FIREWALL_EXCEPTION=1",

            "SET_ACCEPTRFBCONNECTIONS=1",
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1",

            "SET_USEVNCAUTHENTICATION=1",
            "VALUE_OF_USEVNCAUTHENTICATION=1",

            "SET_PASSWORD=1",
            "VALUE_OF_PASSWORD=$vncPassword"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($process.ExitCode -ne 0) {
            throw "TightVNC installation failed with exit code $($process.ExitCode)."
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 3. Start TightVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $vnc = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $vnc)) {
            throw "TightVNC executable not found: $vnc"
          }

          # Make sure the service exists
          & $vnc -install -silent 2>$null

          Start-Sleep -Seconds 3

          # Start server
          & $vnc -start -silent 2>$null

          Start-Sleep -Seconds 5

          $service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($service) {

            Write-Host "TightVNC service status: $($service.Status)"

            if ($service.Status -ne "Running") {
              Start-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
            }
          }

          Write-Host "TightVNC started."

      # ============================================================
      # 4. Verify VNC port 5900
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              Write-Host "VNC is listening on 127.0.0.1:5900"
              $ready = $true
              break
            }

            Write-Host "Waiting for VNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$ready) {

            Write-Host ""
            Write-Host "TightVNC service:"
            Get-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "TightVNC processes:"
            Get-Process |
              Where-Object {
                $_.ProcessName -match "tvn|vnc"
              } |
              Format-Table -AutoSize

            throw "TightVNC did not open port 5900."
          }

      # ============================================================
      # 5. Download noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing noVNC"
          Write-Host "============================================"

          $noVNC = "C:\noVNC"

          if (Test-Path $noVNC) {
            Remove-Item `
              $noVNC `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $noVNC

          if (!(Test-Path "$noVNC\vnc.html")) {
            throw "noVNC was not installed correctly."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 6. Install websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing websockify"
          Write-Host "============================================"

          $python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$python) {

            Write-Host "Python not found. Installing Python..."

            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            Start-Sleep -Seconds 5
          }

          $python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$python) {
            throw "Python was not found."
          }

          $pythonPath = $python.Source

          Write-Host "Python: $pythonPath"

          & $pythonPath -m pip install --upgrade pip
          & $pythonPath -m pip install websockify

          $pythonDirectory = Split-Path $pythonPath
          $scriptsDirectory = Join-Path $pythonDirectory "Scripts"
          $websockify = Join-Path $scriptsDirectory "websockify.exe"

          if (!(Test-Path $websockify)) {

            $command = Get-Command `
              websockify.exe `
              -ErrorAction SilentlyContinue

            if ($command) {
              $websockify = $command.Source
            } else {
              throw "websockify.exe was not found."
            }
          }

          echo "WEBSOCKIFY_EXE=$websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $websockify"

      # ============================================================
      # 7. Start noVNC
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting noVNC"
          Write-Host "============================================"

          $noVNC = "C:\noVNC"
          $websockify = $env:WEBSOCKIFY_EXE

          $stdout = "$noVNC\websockify-stdout.log"
          $stderr = "$noVNC\websockify-stderr.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          # 6080 = HTTP/WebSocket port
          # 5900 = TightVNC
          $arguments = @(
            "--web",
            $noVNC,
            "6080",
            "127.0.0.1:5900"
          )

          Write-Host "Starting websockify..."

          Start-Process `
            -FilePath $websockify `
            -ArgumentList $arguments `
            -WorkingDirectory $noVNC `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              Write-Host "noVNC is listening on 127.0.0.1:6080"
              $ready = $true
              break
            }

            Write-Host "Waiting for noVNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$ready) {

            Write-Host ""
            Write-Host "========== websockify stdout =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host ""
            Write-Host "========== websockify stderr =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "noVNC/websockify did not start."
          }

      # ============================================================
      # 8. Download cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing cloudflared"
          Write-Host "============================================"

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {
            throw "cloudflared download failed."
          }

          Write-Host "cloudflared installed."

      # ============================================================
      # 9. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"

          $stdout = "C:\cloudflared-stdout.log"
          $stderr = "C:\cloudflared-stderr.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Target: http://127.0.0.1:6080"

          Start-Process `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "Waiting for Quick Tunnel URL..."

          $url = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            $content = ""

            if (Test-Path $stdout) {
              $content += "`n" + (
                Get-Content `
                  $stdout `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $stderr) {
              $content += "`n" + (
                Get-Content `
                  $stderr `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            $match = [regex]::Match(
              $content,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $url = $match.Value
              break
            }

            Write-Host "Waiting... $i/60"
          }

          if (!$url) {

            Write-Host ""
            Write-Host "========== cloudflared stdout =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host ""
            Write-Host "========== cloudflared stderr =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "Cloudflare Quick Tunnel URL was not found."
          }

          # No autoconnect.
          # Browser opens noVNC interface first.
          $novncUrl = "$url/vnc.html"

          echo "CLOUDFLARE_URL=$url" >> $env:GITHUB_ENV
          echo "NOVNC_URL=$novncUrl" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $novncUrl
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 10. Show everything
      # ============================================================
      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 WINDOWS 11 READY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "noVNC URL:"
          Write-Host $env:NOVNC_URL
          Write-Host ""

          Write-Host "RDP:"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "Local VNC:"
          Write-Host "127.0.0.1:5900"
          Write-Host ""

          Write-Host "Local noVNC:"
          Write-Host "127.0.0.1:6080"
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "Session will remain alive for up to 6 hours."
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 11. Keep the Windows runner alive
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              WINDOWS SESSION IS RUNNING"
          Write-Host "============================================================"
          Write-Host ""

          while ($true) {

            $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$time] Windows + VNC + noVNC + Cloudflare alive..."

            Start-Sleep -Seconds 300
          }
```
