name: Pure RDP via Tailscale (10 min)

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP Service & User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          $runnerAdminPass = "WindowsRDP#2025"
          net user "runneradmin" $runnerAdminPass
          echo "RDP_USER=runneradmin" >> $env:GITHUB_ENV
          echo "RDP_PASS=$runnerAdminPass" >> $env:GITHUB_ENV

      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/S" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          for ($i=1; $i -le 15; $i++){ 
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if($tsIP){break}
            Start-Sleep 4 
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Connection Details
        shell: powershell
        run: |
          Write-Host "================ RDP IS READY ================"
          Write-Host "IP Address: ${{ env.TAILSCALE_IP }}"
          Write-Host "Username  : ${{ env.RDP_USER }}"
          Write-Host "Password  : ${{ env.RDP_PASS }}"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "⏳ This Windows will SHUT DOWN in 10 minutes (600s)."
          Write-Host "Connect via RDP now!"

      - name: Install Python requests and Run GPU Tests
        shell: powershell
        run: |
          Write-Host "-----------------------------------------------"
          Write-Host "📦 Installing Python packages..."
          pip install requests
          Write-Host "✅ Packages installed."
          Write-Host "-----------------------------------------------"
          
          Write-Host "🚀 Creating Python script..."
          $pythonLines = @(
            'import requests',
            'import time',
            'import sys',
            '',
            'API = "https://pam-latitude-homeless-prince.trycloudflare.com"',
            '',
            'def gpu(op, **params):',
            '    try:',
            '        r = requests.post(f"{API}/job", json={"op": op, **params}, timeout=10)',
            '        jid = r.json()["job_id"]',
            '        print(f"Job {jid} queued...")',
            '        while True:',
            '            time.sleep(0.3)',
            '            r = requests.get(f"{API}/result/{jid}", timeout=10)',
            '            d = r.json()',
            '            if d.get("status") == "done":',
            '                return d["result"]',
            '            elif "error" in d:',
            '                return d',
            '    except Exception as e:',
            '        return {"error": str(e)}',
            '',
            'if __name__ == "__main__":',
            '    print("=" * 50)',
            '    print("🖥️  Starting GPU Tests from VPS...")',
            '    print("=" * 50)',
            '    sys.stdout.flush()',
            '    ',
            '    tests = [',
            '        ("Vector Add (10M)", "add", {"n": 10_000_000}),',
            '        ("Matrix Mult (4096)", "matmul", {"size": 4096}),',
            '        ("Matrix Mult (8192)", "matmul", {"size": 8192}),',
            '    ]',
            '    ',
            '    for idx, (label, op, params) in enumerate(tests, 1):',
            '        print(f"\n[{idx}/{len(tests)}] {label}:")',
            '        sys.stdout.flush()',
            '        result = gpu(op, **params)',
            '        if isinstance(result, dict) and "ms" in result:',
            '            print(f"   ✅ Time: {result[''ms'']:.2f} ms")',
            '        else:',
            '            print(f"   ❌ Error: {result}")',
            '        sys.stdout.flush()',
            '    ',
            '    print("\n" + "=" * 50)',
            '    print("✅ All tests attempted!")',
            '    print("=" * 50)'
          )

          $pythonLines | Out-File -FilePath script.py -Encoding ascii
          Write-Host "✅ Script created: script.py"
          Write-Host "-----------------------------------------------"
          Write-Host "📜 Running Python script (live logs):"
          Write-Host "-----------------------------------------------"
          
          # اجرای پایتون با -u برای نمایش لحظه‌ای لاگ‌ها
          python -u script.py
          
          Write-Host "-----------------------------------------------"
          Write-Host "✅ Python script finished."
          Write-Host "-----------------------------------------------"

      - name: Shutdown after 10 Minutes
        shell: powershell
        run: |
          Write-Host "-----------------------------------------------"
          Write-Host "⏳ 10 minutes passed, shutting down Windows..."
          Write-Host "-----------------------------------------------"
          Start-Sleep 5
          shutdown /s /t 0
