name: Windows 11 - noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Write-Host "============================================"
          Write-Host "Configuring RDP"
          Write-Host "============================================"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $Existing = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($Existing) {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
            throw "TightVNC installer not found."
          }

          $VncPassword = "MyVNC123"

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($Process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installed."

      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
            throw "TightVNC executable not found."
          }

          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($Service -and $Service.Status -ne "Running") {
            Start-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          Write-Host "TightVNC service:"
          Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Verify VNC
        shell: powershell
        run: |
          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              Write-Host "VNC is listening on 127.0.0.1:5900"
              $Ready = $true
              break
            }

            Write-Host "Waiting for VNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {
            throw "VNC port 5900 did not open."
          }

      # ============================================================
      # 3. noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
            Remove-Item `
              $NoVncPath `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 4. websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            Start-Sleep -Seconds 5
          }

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            throw "Python not found."
          }

          $PythonPath = $Python.Source

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          $PythonDir = Split-Path $PythonPath
          $ScriptsDir = Join-Path $PythonDir "Scripts"
          $Websockify = Join-Path $ScriptsDir "websockify.exe"

          if (!(Test-Path $Websockify)) {
            $Command = Get-Command `
              websockify.exe `
              -ErrorAction SilentlyContinue

            if (!$Command) {
              throw "websockify.exe not found."
            }

            $Websockify = $Command.Source
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE

          $Stdout = "$NoVncPath\websockify-stdout.log"
          $Stderr = "$NoVncPath\websockify-stderr.log"

          Remove-Item $Stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $Stderr -Force -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath $Websockify `
            -ArgumentList @(
              "--web"
              $NoVncPath
              "6080"
              "127.0.0.1:5900"
            ) `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {
              Write-Host "noVNC/websockify is listening on 127.0.0.1:6080"
              $Ready = $true
              break
            }

            Write-Host "Waiting for noVNC... $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$Ready) {

            Write-Host "========== websockify stdout =========="

            if (Test-Path $Stdout) {
              Get-Content $Stdout
            }

            Write-Host "========== websockify stderr =========="

            if (Test-Path $Stderr) {
              Get-Content $Stderr
            }

            throw "noVNC did not start."
          }

      # ============================================================
      # 5. cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared `
            -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
            throw "cloudflared download failed."
          }

          & $Cloudflared version

      # ============================================================
      # 6. Test Cloudflare edge connectivity
      # ============================================================
      - name: Diagnose Cloudflare connectivity
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             CLOUDFLARE CONNECTIVITY TEST"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "DNS:"
          Resolve-DnsName `
            region1.v2.argotunnel.com `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "TCP 7844:"
          Test-NetConnection `
            region1.v2.argotunnel.com `
            -Port 7844 `
            -WarningAction SilentlyContinue |
            Format-List

          Write-Host ""
          Write-Host "HTTPS 7844 test:"

          curl.exe `
            -4 `
            -vk `
            --connect-timeout 10 `
            --max-time 15 `
            "https://region1.v2.argotunnel.com:7844" 2>&1 |
            Select-Object -First 40

      # ============================================================
      # 7. Start Quick Tunnel and keep alive
      # ============================================================
      - name: Start Quick Tunnel and Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"
          $Target = "http://127.0.0.1:6080"

          $Stdout = "C:\cloudflared-stdout.log"
          $Stderr = "C:\cloudflared-stderr.log"

          Remove-Item $Stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $Stderr -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             STARTING QUICK TUNNEL"
          Write-Host "============================================================"
          Write-Host ""

          $TunnelProcess = Start-Process `
            -FilePath $Cloudflared `
            -ArgumentList @(
              "tunnel"
              "--no-autoupdate"
              "--protocol"
              "auto"
              "--edge-ip-version"
              "4"
              "--url"
              $Target
            ) `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "cloudflared PID: $($TunnelProcess.Id)"
          Write-Host ""

          $Url = $null
          $Connected = $false

          for ($i = 1; $i -le 90; $i++) {

            Start-Sleep -Seconds 2

            if ($TunnelProcess.HasExited) {
              Write-Host "cloudflared exited with code $($TunnelProcess.ExitCode)."
              break
            }

            $Content = ""

            if (Test-Path $Stdout) {
              $Content += "`n" + (
                Get-Content `
                  $Stdout `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $Stderr) {
              $Content += "`n" + (
                Get-Content `
                  $Stderr `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            if (!$Url) {

              $Match = [regex]::Match(
                $Content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($Match.Success) {
                $Url = $Match.Value
              }
            }

            # This is more important than merely receiving the URL.
            if (
              $Content -match "Registered tunnel connection" -or
              $Content -match "Registered tunnel connection connIndex"
            ) {
              $Connected = $true
            }

            if ($Url) {
              Write-Host "Quick Tunnel URL detected: $Url"
            }

            if ($Connected) {
              Write-Host "Cloudflare tunnel connection registered."
              break
            }

            Write-Host "Waiting for Cloudflare connection... $i/90"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 CLOUDFLARE LOGS"
          Write-Host "============================================================"

          if (Test-Path $Stdout) {
            Write-Host ""
            Write-Host "---------- STDOUT ----------"
            Get-Content $Stdout
          }

          if (Test-Path $Stderr) {
            Write-Host ""
            Write-Host "---------- STDERR ----------"
            Get-Content $Stderr
          }

          if (!$Connected) {
            throw @"
cloudflared obtained a Quick Tunnel URL but did not register a healthy
connection to the Cloudflare edge.

This is a Cloudflare connectivity problem, not a noVNC problem.
"@
          }

          if (!$Url) {
            throw "Cloudflare tunnel connection was registered but no trycloudflare URL was found."
          }

          $NoVncUrl = "$Url/vnc.html"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "RDP PASSWORD:"
          Write-Host "WindowsRDP#2025"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          # Keep everything alive.
          while ($true) {

            Start-Sleep -Seconds 30

            $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            if ($TunnelProcess.HasExited) {

              Write-Host ""
              Write-Host "[$Now] cloudflared exited."
              Write-Host "Workflow will stop so the failure is visible."

              break
            }

            Write-Host "[$Now] Windows + VNC + noVNC + Cloudflare alive."
          }

