name: Browser RDP via Myrtille

on:
  workflow_dispatch:

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. تنظیمات RDP و ساخت کاربر
      - name: Configure RDP Service & User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $runnerAdminPass = "WindowsRDP#2025"
          net user "runneradmin" $runnerAdminPass
          echo "RDP_USER=runneradmin" >> $env:GITHUB_ENV
          echo "RDP_PASS=$runnerAdminPass" >> $env:GITHUB_ENV

      # 2. نصب IIS و پیش‌نیازهای Myrtille
      - name: Install IIS and .NET Prerequisites
        shell: powershell
        run: |
          # نصب IIS و ویژگی‌های لازم
          Install-WindowsFeature -Name Web-Server -IncludeManagementTools
          Install-WindowsFeature -Name Web-Asp-Net45
          Install-WindowsFeature -Name Web-WCFServices
          Install-WindowsFeature -Name Web-Windows-Auth
          Install-WindowsFeature -Name Web-Metabase
          Write-Host "IIS installed successfully"

      # 3. دانلود و نصب Myrtille
      - name: Download and Install Myrtille
        shell: powershell
        run: |
          # دانلود آخرین نسخه Myrtille (MSI)
          $myrtilleUrl = "https://github.com/cedrozor/myrtille/releases/download/v2.9.2/MyrtilleSetup.msi"
          Invoke-WebRequest -Uri $myrtilleUrl -OutFile "MyrtilleSetup.msi" -UseBasicParsing

          # نصب سایلنت Myrtille
          Start-Process msiexec.exe -ArgumentList "/i MyrtilleSetup.msi /quiet /norestart /l*vx install.log" -Wait

          # بررسی نصب
          if (Test-Path "C:\Program Files\Myrtille") {
            Write-Host "Myrtille installed successfully"
          } else {
            Write-Host "::error::Myrtille installation failed"
            Get-Content install.log -Tail 50
            exit 1
          }

      # 4. راه‌اندازی IIS و تنظیم Application Pool
      - name: Start IIS and Configure Myrtille
        shell: powershell
        run: |
          # اطمینان از اجرا بودن IIS
          Start-Service W3SVC
          Start-Sleep 10

          # تنظیم Application Pool به حالت Classic
          & "$env:SystemRoot\system32\inetsrv\appcmd.exe" set app "Default Web Site/" /applicationPool:"Classic .NET AppPool"
          & "$env:SystemRoot\system32\inetsrv\appcmd.exe" set apppool "MyrtilleAppPool" /managedPipelineMode:Classic
          & "$env:SystemRoot\system32\inetsrv\appcmd.exe" set apppool "MyrtilleAppPool" /managedRuntimeVersion:v4.0

          # ری‌استارت IIS
          iisreset
          Write-Host "IIS configured for Myrtille"

      # 5. تست دسترسی محلی به Myrtille
      - name: Test Myrtille Locally
        shell: powershell
        run: |
          Start-Sleep 10
          try {
            $response = Invoke-WebRequest -Uri "http://localhost/Myrtille" -UseBasicParsing -TimeoutSec 30
            if ($response.StatusCode -eq 200) {
              Write-Host "Myrtille is accessible locally at http://localhost/Myrtille"
            } else {
              Write-Host "::warning::Myrtille returned status: $($response.StatusCode)"
            }
          } catch {
            Write-Host "::warning::Could not reach Myrtille locally: $_"
          }

      # 6. ایجاد تونل Cloudflare برای Myrtille
      - name: Setup Cloudflare Quick Tunnel
        shell: powershell
        run: |
          # دانلود cloudflared
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          $errLog = "$env:TEMP\cf-err.log"
          $outLog = "$env:TEMP\cf-out.log"

          # اجرای تونل به پورت 80 (IIS)
          Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel","--url","http://localhost:80","--no-autoupdate" `
            -RedirectStandardError $errLog `
            -RedirectStandardOutput $outLog `
            -NoNewWindow

          # استخراج URL تونل
          $cfURL = $null
          for ($i=1; $i -le 40; $i++) {
            Start-Sleep 3
            if (Test-Path $errLog) {
              $content = Get-Content $errLog -Raw -ErrorAction SilentlyContinue
              if ($content -match "https://[a-z0-9\-]+\.trycloudflare\.com") {
                $cfURL = $matches[0]
                break
              }
            }
          }

          if ($cfURL) {
            echo "CF_URL=$cfURL" >> $env:GITHUB_ENV
            Write-Host "Cloudflare Tunnel URL: $cfURL"
          } else {
            Write-Host "::error::Could not get Cloudflare URL"
            if (Test-Path $errLog) { Get-Content $errLog -Tail 30 }
            exit 1
          }

      # 7. نمایش اطلاعات اتصال و نگه داشتن session
      - name: Display Connection Details and Keep Alive
        shell: powershell
        run: |
          Write-Host "================================================="
          Write-Host ""
          Write-Host "🌐 BROWSER RDP READY!"
          Write-Host ""
          Write-Host "Open this URL in your browser:"
          Write-Host "   ${{ env.CF_URL }}/Myrtille"
          Write-Host ""
          Write-Host "🔑 RDP Login (inside Myrtille):"
          Write-Host "   Username : ${{ env.RDP_USER }}"
          Write-Host "   Password : ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "   RDP Server: localhost:3389"
          Write-Host ""
          Write-Host "================================================="

          # حلقه بی‌نهایت برای زنده نگه داشتن runner
          while ($true) {
            Start-Sleep 300
          }
