name: Windows 11 - noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Configuring Windows RDP"
          Write-Host "============================================"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $Existing = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($Existing) {
              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword
          }
          else {
              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
              throw "TightVNC installer was not downloaded."
          }

          # TightVNC VNC password.
          # Maximum 8 characters.
          $VncPassword = "MyVNC123"

          Write-Host "Installing TightVNC..."

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($Process.ExitCode -ne 0) {
              throw "TightVNC installation failed. Exit code: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 3. Start TightVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
              throw "TightVNC executable not found."
          }

          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($Service) {
              Write-Host "TightVNC service: $($Service.Status)"

              if ($Service.Status -ne "Running") {
                  Start-Service `
                    -Name "tvnserver" `
                    -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 3
              }
          }

          Write-Host "TightVNC started."

      # ============================================================
      # 4. Verify VNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                -ComputerName "127.0.0.1" `
                -Port 5900 `
                -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {
                  Write-Host "VNC is listening on 127.0.0.1:5900"
                  $Ready = $true
                  break
              }

              Write-Host "Waiting for VNC... $i/30"
              Start-Sleep -Seconds 2
          }

          if (!$Ready) {
              Get-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              Get-Process |
                Where-Object {
                  $_.ProcessName -match "tvn|vnc"
                } |
                Format-Table -AutoSize

              throw "VNC server is not listening on port 5900."
          }

      # ============================================================
      # 5. Install noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
              Remove-Item `
                $NoVncPath `
                -Recurse `
                -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
              throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 6. Install websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing websockify"
          Write-Host "============================================"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
              winget install `
                --id Python.Python.3.12 `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Start-Sleep -Seconds 5
          }

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
              throw "Python was not found."
          }

          $PythonPath = $Python.Source

          Write-Host "Python: $PythonPath"

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          $PythonDir = Split-Path $PythonPath
          $ScriptsDir = Join-Path $PythonDir "Scripts"
          $Websockify = Join-Path $ScriptsDir "websockify.exe"

          if (!(Test-Path $Websockify)) {

              $Command = Get-Command `
                websockify.exe `
                -ErrorAction SilentlyContinue

              if ($Command) {
                  $Websockify = $Command.Source
              }
              else {
                  throw "websockify.exe was not found."
              }
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      # ============================================================
      # 7. Start noVNC
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE

          $Stdout = "$NoVncPath\websockify-stdout.log"
          $Stderr = "$NoVncPath\websockify-stderr.log"

          Remove-Item `
            $Stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $Stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $Arguments = @(
            "--web"
            $NoVncPath
            "6080"
            "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath $Websockify `
            -ArgumentList $Arguments `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                -ComputerName "127.0.0.1" `
                -Port 6080 `
                -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {
                  Write-Host "noVNC/websockify is listening on 127.0.0.1:6080"
                  $Ready = $true
                  break
              }

              Write-Host "Waiting for noVNC... $i/30"
              Start-Sleep -Seconds 2
          }

          if (!$Ready) {

              Write-Host "========== websockify stdout =========="

              if (Test-Path $Stdout) {
                  Get-Content $Stdout
              }

              Write-Host "========== websockify stderr =========="

              if (Test-Path $Stderr) {
                  Get-Content $Stderr
              }

              throw "noVNC/websockify failed to start."
          }

      # ============================================================
      # 8. Install cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading cloudflared"
          Write-Host "============================================"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared `
            -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
              throw "cloudflared download failed."
          }

          Write-Host "cloudflared installed."

      # ============================================================
      # 9. Cloudflare + health check + keep alive
      # ============================================================
      - name: Start Cloudflare and Keep Session Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"
          $Target = "http://127.0.0.1:6080"

          function Start-QuickTunnel {

              $Stdout = "C:\cloudflared-stdout.log"
              $Stderr = "C:\cloudflared-stderr.log"

              Remove-Item `
                $Stdout `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $Stderr `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "============================================"
              Write-Host "Starting Cloudflare Quick Tunnel"
              Write-Host "============================================"
              Write-Host ""
              Write-Host "Origin: $Target"
              Write-Host "Protocol: HTTP/2"
              Write-Host ""

              $Process = Start-Process `
                -FilePath $Cloudflared `
                -ArgumentList @(
                  "tunnel"
                  "--no-autoupdate"
                  "--protocol"
                  "http2"
                  "--url"
                  $Target
                ) `
                -RedirectStandardOutput $Stdout `
                -RedirectStandardError $Stderr `
                -WindowStyle Hidden `
                -PassThru

              Write-Host "cloudflared PID: $($Process.Id)"

              $Url = $null

              for ($i = 1; $i -le 60; $i++) {

                  Start-Sleep -Seconds 2

                  if ($Process.HasExited) {
                      Write-Host "cloudflared exited."
                      return $null
                  }

                  $Content = ""

                  if (Test-Path $Stdout) {
                      $Content += "`n" + (
                        Get-Content `
                          $Stdout `
                          -Raw `
                          -ErrorAction SilentlyContinue
                      )
                  }

                  if (Test-Path $Stderr) {
                      $Content += "`n" + (
                        Get-Content `
                          $Stderr `
                          -Raw `
                          -ErrorAction SilentlyContinue
                      )
                  }

                  $Match = [regex]::Match(
                    $Content,
                    'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                  )

                  if ($Match.Success) {
                      $Url = $Match.Value
                      break
                  }

                  Write-Host "Waiting for tunnel URL... $i/60"
              }

              if (!$Url) {

                  Write-Host "========== cloudflared stdout =========="

                  if (Test-Path $Stdout) {
                      Get-Content $Stdout
                  }

                  Write-Host "========== cloudflared stderr =========="

                  if (Test-Path $Stderr) {
                      Get-Content $Stderr
                  }

                  return $null
              }

              $RemoteUrl = "$Url/vnc.html"

              Write-Host ""
              Write-Host "Tunnel URL:"
              Write-Host $Url
              Write-Host ""
              Write-Host "Testing:"
              Write-Host $RemoteUrl
              Write-Host ""

              $Healthy = $false

              for ($i = 1; $i -le 30; $i++) {

                  try {

                      $Response = Invoke-WebRequest `
                        -Uri $RemoteUrl `
                        -UseBasicParsing `
                        -TimeoutSec 10 `
                        -MaximumRedirection 5

                      Write-Host "Remote HTTP status: $($Response.StatusCode)"

                      if (
                        $Response.StatusCode -ge 200 -and
                        $Response.StatusCode -lt 400
                      ) {
                          $Healthy = $true
                          break
                      }

                  }
                  catch {

                      Write-Host "Remote check failed."
                  }

                  Start-Sleep -Seconds 3
              }

              if (!$Healthy) {

                  Write-Host ""
                  Write-Host "Tunnel was created but is not reachable."
                  Write-Host ""

                  if (Test-Path $Stdout) {
                      Write-Host "========== cloudflared stdout =========="
                      Get-Content $Stdout
                  }

                  if (Test-Path $Stderr) {
                      Write-Host "========== cloudflared stderr =========="
                      Get-Content $Stderr
                  }

                  try {
                      Stop-Process `
                        -Id $Process.Id `
                        -Force `
                        -ErrorAction SilentlyContinue
                  }
                  catch {}

                  return $null
              }

              Write-Host ""
              Write-Host "Tunnel is healthy."
              Write-Host ""

              return @{
                  Process = $Process
                  Url = $Url
              }
          }

          # ========================================================
          # Start the first tunnel
          # ========================================================

          $Tunnel = Start-QuickTunnel

          if (!$Tunnel) {
              throw "Could not create a healthy Cloudflare Quick Tunnel."
          }

          $CloudflareProcess = $Tunnel.Process
          $CloudflareUrl = $Tunnel.Url
          $NoVncUrl = "$CloudflareUrl/vnc.html"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "RDP PASSWORD:"
          Write-Host "WindowsRDP#2025"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          # ========================================================
          # Keep Windows runner and tunnel alive.
          # Recreate tunnel if cloudflared exits.
          # ========================================================

          while ($true) {

              Start-Sleep -Seconds 30

              $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              if ($CloudflareProcess.HasExited) {

                  Write-Host ""
                  Write-Host "============================================================"
                  Write-Host "[$Now] cloudflared stopped."
                  Write-Host "Creating a new tunnel..."
                  Write-Host "============================================================"
                  Write-Host ""

                  $Tunnel = Start-QuickTunnel

                  if ($Tunnel) {

                      $CloudflareProcess = $Tunnel.Process
                      $CloudflareUrl = $Tunnel.Url
                      $NoVncUrl = "$CloudflareUrl/vnc.html"

                      Write-Host ""
                      Write-Host "============================================================"
                      Write-Host "                     NEW noVNC URL"
                      Write-Host "============================================================"
                      Write-Host ""
                      Write-Host $NoVncUrl
                      Write-Host ""
                      Write-Host "VNC PASSWORD:"
                      Write-Host "MyVNC123"
                      Write-Host ""
                      Write-Host "============================================================"
                      Write-Host ""

                  }
                  else {

                      Write-Host "Could not create new tunnel."
                      Write-Host "Retrying in 30 seconds."
                  }

              }
              else {

                  Write-Host "[$Now] Windows + noVNC + Cloudflare alive."
              }
          }
