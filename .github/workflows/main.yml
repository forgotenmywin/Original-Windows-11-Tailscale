name: Browser RDP via Myrtille + Cloudflare

on:
  workflow_dispatch:

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: runneradmin
      RDP_PASS: ${{ secrets.RDP_PASSWORD }}

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " WINDOWS RUNNER INFORMATION"
          Write-Host "=========================================="

          Get-ComputerInfo |
            Select-Object `
              WindowsProductName,
              WindowsVersion,
              OsBuildNumber,
              CsName |
            Format-List


      # ============================================================
      # 2. ENABLE RDP
      # ============================================================

      - name: Enable RDP
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " ENABLING RDP"
          Write-Host "=========================================="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable NLA
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Enable firewall rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Ensure TermService starts automatically
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."


      # ============================================================
      # 3. CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=========================================="

          $username = $env:RDP_USER
          $password = $env:RDP_PASS

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD GitHub Secret is not configured."
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "User already exists."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

          }
          else {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword

          }

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


      # ============================================================
      # 4. INSTALL IIS
      # ============================================================

      - name: Install IIS
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " INSTALLING IIS"
          Write-Host "=========================================="

          Install-WindowsFeature `
            -Name Web-Server `
            -IncludeManagementTools

          Install-WindowsFeature `
            -Name Web-WebSockets

          Install-WindowsFeature `
            -Name Web-Asp-Net45 `
            -ErrorAction SilentlyContinue

          Install-WindowsFeature `
            -Name Web-Net-Ext45 `
            -ErrorAction SilentlyContinue

          Install-WindowsFeature `
            -Name Web-ISAPI-Ext `
            -ErrorAction SilentlyContinue

          Install-WindowsFeature `
            -Name Web-ISAPI-Filter `
            -ErrorAction SilentlyContinue

          Install-WindowsFeature `
            -Name Web-Mgmt-Console `
            -ErrorAction SilentlyContinue

          # WCF HTTP Activation
          dism.exe `
            /online `
            /enable-feature `
            /featurename:WCF-HTTP-Activation45 `
            /all `
            /norestart

          Write-Host "IIS installation complete."


      # ============================================================
      # 5. REGISTER ASP.NET
      # ============================================================

      - name: Configure ASP.NET and IIS
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " CONFIGURING ASP.NET / IIS"
          Write-Host "=========================================="

          $aspnet = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\aspnet_regiis.exe"

          if (Test-Path $aspnet) {

              & $aspnet -i

          }
          else {

              Write-Host "aspnet_regiis.exe not found in Framework64."

          }

          Import-Module WebAdministration

          Start-Service W3SVC -ErrorAction SilentlyContinue

          Set-Service `
            -Name W3SVC `
            -StartupType Automatic

          Write-Host "IIS configured."


      # ============================================================
      # 6. SHOW IIS VERSION
      # ============================================================

      - name: Check IIS
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " IIS STATUS"
          Write-Host "=========================================="

          $iisPath = "HKLM:\SOFTWARE\Microsoft\InetStp"

          $iisInfo = Get-ItemProperty $iisPath

          Write-Host "IIS Major Version : $($iisInfo.MajorVersion)"
          Write-Host "IIS Minor Version : $($iisInfo.MinorVersion)"
          Write-Host "IIS Version       : $($iisInfo.VersionString)"

          & "$env:WINDIR\System32\inetsrv\appcmd.exe" list site

          Get-Service W3SVC |
            Format-Table Name, Status, StartType


      # ============================================================
      # 7. DOWNLOAD MYRTILLE
      # ============================================================

      - name: Download Myrtille
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " DOWNLOADING MYRTILLE"
          Write-Host "=========================================="

          $url = "https://github.com/myrtille-rdp/myrtille/releases/latest/download/Myrtille.msi"

          $installer = "$env:RUNNER_TEMP\Myrtille.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
              throw "Myrtille installer download failed."
          }

          Write-Host "Installer:"
          Write-Host $installer

          Get-Item $installer |
            Format-List Name, Length, FullName


      # ============================================================
      # 8. INSTALL MYRTILLE
      # ============================================================

      - name: Install Myrtille
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " INSTALLING MYRTILLE"
          Write-Host "=========================================="

          $installer = "$env:RUNNER_TEMP\Myrtille.msi"

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$installer`"",
              "/qn",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          Write-Host "MSI Exit Code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              throw "Myrtille installation failed."
          }

          Write-Host "Myrtille installed."


      # ============================================================
      # 9. CONFIGURE MYRTILLE IIS
      # ============================================================

      - name: Configure Myrtille IIS
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " CONFIGURING MYRTILLE"
          Write-Host "=========================================="

          Import-Module WebAdministration

          $appPool = "MyrtilleAppPool"

          if (Test-Path "IIS:\AppPools\$appPool") {

              Set-ItemProperty `
                "IIS:\AppPools\$appPool" `
                -Name managedRuntimeVersion `
                -Value "v4.0"

              Set-ItemProperty `
                "IIS:\AppPools\$appPool" `
                -Name processModel.idleTimeout `
                -Value ([TimeSpan]::Zero)

              Start-WebAppPool `
                -Name $appPool `
                -ErrorAction SilentlyContinue

          }

          # Make sure IIS is running
          Start-Service W3SVC `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "IIS Applications:"
          & "$env:WINDIR\System32\inetsrv\appcmd.exe" list app

          Write-Host ""
          Write-Host "Application Pools:"
          & "$env:WINDIR\System32\inetsrv\appcmd.exe" list apppool


      # ============================================================
      # 10. TEST MYRTILLE LOCALLY
      # ============================================================

      - name: Test Myrtille
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " TESTING MYRTILLE"
          Write-Host "=========================================="

          $urls = @(
            "http://127.0.0.1/myrtille",
            "http://localhost/myrtille"
          )

          $success = $false

          foreach ($url in $urls) {

              Write-Host ""
              Write-Host "Testing: $url"

              try {

                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 15 `
                    -ErrorAction Stop

                  Write-Host "HTTP Status: $($response.StatusCode)"

                  if ($response.StatusCode -eq 200) {
                      $success = $true
                      $env:MYRTILLE_URL = $url
                      break
                  }

              }
              catch {

                  Write-Host "Failed: $($_.Exception.Message)"

              }
          }

          if (!$success) {
              throw "Myrtille is not responding locally."
          }

          Write-Host ""
          Write-Host "Myrtille local test PASSED."


      # ============================================================
      # 11. DOWNLOAD CLOUDFLARED
      # ============================================================

      - name: Install Cloudflared
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " INSTALLING CLOUDFLARED"
          Write-Host "=========================================="

          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
              throw "cloudflared download failed."
          }

          Unblock-File `
            -Path $cloudflared `
            -ErrorAction SilentlyContinue

          Write-Host "cloudflared version:"

          & $cloudflared --version


      # ============================================================
      # 12. FINAL LONG-LIVED STEP
      #
      # IMPORTANT:
      # Cloudflare is started HERE and remains inside THIS SAME STEP.
      # Do not move cloudflared into a previous step.
      # ============================================================

      - name: Start Cloudflare and Keep Session Alive
        shell: powershell
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "        BROWSER RDP SESSION"
          Write-Host "============================================================"

          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          $cfDir = "$env:RUNNER_TEMP\cloudflare"

          New-Item `
            -ItemType Directory `
            -Path $cfDir `
            -Force |
            Out-Null

          $errLog = "$cfDir\cloudflared-error.log"
          $outLog = "$cfDir\cloudflared-output.log"

          # --------------------------------------------------------
          # Kill any old cloudflared process
          # --------------------------------------------------------

          Get-Process cloudflared `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2


          # --------------------------------------------------------
          # Function: Extract URL
          # --------------------------------------------------------

          function Get-TunnelUrl {

              if (!(Test-Path $errLog)) {
                  return $null
              }

              try {

                  $content = Get-Content `
                    $errLog `
                    -Raw `
                    -ErrorAction SilentlyContinue

                  if ($content -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {

                      return $matches[0]

                  }

              }
              catch {

                  return $null

              }

              return $null
          }


          # --------------------------------------------------------
          # Function: Start Quick Tunnel
          # --------------------------------------------------------

          function Start-QuickTunnel {

              Write-Host ""
              Write-Host "============================================================"
              Write-Host " STARTING CLOUDFLARE QUICK TUNNEL"
              Write-Host "============================================================"

              Remove-Item `
                $errLog `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $outLog `
                -Force `
                -ErrorAction SilentlyContinue


              $process = Start-Process `
                -FilePath $cloudflared `
                -ArgumentList @(
                  "tunnel",
                  "--url",
                  "http://127.0.0.1:80",
                  "--no-autoupdate",
                  "--protocol",
                  "http2"
                ) `
                -RedirectStandardError $errLog `
                -RedirectStandardOutput $outLog `
                -PassThru `
                -WindowStyle Hidden


              Write-Host ""
              Write-Host "cloudflared PID: $($process.Id)"
              Write-Host ""


              # Wait for URL
              $url = $null

              for ($i = 1; $i -le 45; $i++) {

                  Start-Sleep -Seconds 1

                  if ($process.HasExited) {

                      Write-Host ""
                      Write-Host "ERROR: cloudflared exited."
                      Write-Host ""

                      if (Test-Path $errLog) {
                          Get-Content `
                            $errLog `
                            -Tail 100
                      }

                      return $null
                  }

                  $url = Get-TunnelUrl

                  if ($url) {
                      break
                  }
              }


              if (!$url) {

                  Write-Host ""
                  Write-Host "ERROR: Cloudflare URL was not detected."
                  Write-Host ""

                  if (Test-Path $errLog) {
                      Get-Content `
                        $errLog `
                        -Tail 100
                  }

                  return $null
              }


              Write-Host ""
              Write-Host "============================================================"
              Write-Host " CLOUDFLARE TUNNEL READY"
              Write-Host "============================================================"
              Write-Host ""
              Write-Host "Cloudflare:"
              Write-Host "$url"
              Write-Host ""
              Write-Host "MYRTILLE:"
              Write-Host "$url/myrtille"
              Write-Host ""
              Write-Host "============================================================"
              Write-Host ""

              return $url
          }


          # --------------------------------------------------------
          # Start tunnel
          # --------------------------------------------------------

          $currentUrl = Start-QuickTunnel

          if (!$currentUrl) {

              Write-Host ""
              Write-Host "Cloudflare tunnel failed to start."
              Write-Host ""

              exit 1
          }


          $currentPid = (
              Get-Process cloudflared `
                -ErrorAction SilentlyContinue
          ).Id


          # --------------------------------------------------------
          # Check public URL
          # --------------------------------------------------------

          Start-Sleep -Seconds 8

          try {

              $publicTest = Invoke-WebRequest `
                -Uri "$currentUrl/myrtille" `
                -UseBasicParsing `
                -TimeoutSec 20 `
                -ErrorAction Stop

              Write-Host ""
              Write-Host "============================================================"
              Write-Host " PUBLIC TEST PASSED"
              Write-Host "============================================================"
              Write-Host ""
              Write-Host "HTTP Status: $($publicTest.StatusCode)"
              Write-Host ""
              Write-Host "BROWSER:"
              Write-Host "$currentUrl/myrtille"
              Write-Host ""

          }
          catch {

              Write-Host ""
              Write-Host "::warning::Public URL test failed."
              Write-Host $_.Exception.Message
              Write-Host ""

              # Do NOT immediately kill the tunnel.
              # Cloudflare may still be establishing connections.

          }


          # --------------------------------------------------------
          # KEEP RUNNER ALIVE
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " SESSION IS LIVE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Browser URL:"
          Write-Host "$currentUrl/myrtille"
          Write-Host ""


          while ($true) {

              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host ""
              Write-Host "------------------------------------------------------------"
              Write-Host "[$time] HEALTH CHECK"
              Write-Host "------------------------------------------------------------"


              # ====================================================
              # IIS
              # ====================================================

              $iis = Get-Service `
                -Name W3SVC `
                -ErrorAction SilentlyContinue

              if ($iis) {

                  Write-Host "IIS          : $($iis.Status)"

                  if ($iis.Status -ne "Running") {

                      Write-Host "Starting IIS..."

                      Start-Service `
                        -Name W3SVC `
                        -ErrorAction SilentlyContinue

                  }

              }
              else {

                  Write-Host "IIS          : NOT FOUND"

              }


              # ====================================================
              # RDP
              # ====================================================

              $rdp = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($rdp) {

                  Write-Host "RDP          : $($rdp.Status)"

                  if ($rdp.Status -ne "Running") {

                      Write-Host "Starting RDP service..."

                      Start-Service `
                        -Name TermService `
                        -ErrorAction SilentlyContinue

                  }

              }
              else {

                  Write-Host "RDP          : NOT FOUND"

              }


              # ====================================================
              # MYRTILLE
              # ====================================================

              try {

                  $local = Invoke-WebRequest `
                    -Uri "http://127.0.0.1/myrtille" `
                    -UseBasicParsing `
                    -TimeoutSec 10 `
                    -ErrorAction Stop

                  Write-Host "Myrtille     : HTTP $($local.StatusCode)"

              }
              catch {

                  Write-Host "Myrtille     : ERROR"

              }


              # ====================================================
              # CLOUDFLARE
              # ====================================================

              $cf = Get-Process `
                cloudflared `
                -ErrorAction SilentlyContinue


              if ($cf) {

                  $pidNow = $cf.Id

                  Write-Host "Cloudflare   : RUNNING"
                  Write-Host "CloudflarePID: $pidNow"


                  # Detect PID change
                  if ($currentPid -ne $pidNow) {

                      Write-Host ""
                      Write-Host "::warning::Cloudflare PID changed."

                      $currentPid = $pidNow

                      Start-Sleep -Seconds 3

                      $newUrl = Get-TunnelUrl

                      if ($newUrl) {

                          $currentUrl = $newUrl

                          Write-Host ""
                          Write-Host "============================================================"
                          Write-Host " NEW CLOUDFLARE URL"
                          Write-Host "============================================================"
                          Write-Host ""
                          Write-Host "$currentUrl"
                          Write-Host ""
                          Write-Host "MYRTILLE:"
                          Write-Host "$currentUrl/myrtille"
                          Write-Host ""

                      }

                  }

              }
              else {

                  Write-Host "Cloudflare   : DEAD"

                  Write-Host ""
                  Write-Host "============================================================"
                  Write-Host " CLOUDFLARE DIED - RESTARTING"
                  Write-Host "============================================================"


                  $currentUrl = Start-QuickTunnel


                  if ($currentUrl) {

                      $newProcess = Get-Process `
                        cloudflared `
                        -ErrorAction SilentlyContinue

                      if ($newProcess) {

                          $currentPid = $newProcess.Id

                      }


                      Write-Host ""
                      Write-Host "============================================================"
                      Write-Host " USE THE NEW URL"
                      Write-Host "============================================================"
                      Write-Host ""
                      Write-Host "$currentUrl"
                      Write-Host ""
                      Write-Host "MYRTILLE:"
                      Write-Host "$currentUrl/myrtille"
                      Write-Host ""

                  }
                  else {

                      Write-Host ""
                      Write-Host "::warning::Cloudflare restart failed."
                      Write-Host ""

                  }

              }


              # ====================================================
              # CURRENT URL
              # ====================================================

              if ($currentUrl) {

                  Write-Host ""
                  Write-Host "CURRENT BROWSER URL:"
                  Write-Host "$currentUrl/myrtille"

              }


              # ====================================================
              # LOG TAIL
              # ====================================================

              if (Test-Path $errLog) {

                  $lastLines = Get-Content `
                    $errLog `
                    -Tail 8 `
                    -ErrorAction SilentlyContinue

                  if ($lastLines) {

                      Write-Host ""
                      Write-Host "Cloudflare log:"
                      $lastLines

                  }

              }


              Start-Sleep -Seconds 20
          }
