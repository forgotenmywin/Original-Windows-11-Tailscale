# ============================================================
# Install IIS on Windows Server
# ============================================================

$ErrorActionPreference = "Stop"

Write-Host "============================================"
Write-Host " Installing IIS"
Write-Host "============================================"

# Check Administrator
$currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
$principal = New-Object Security.Principal.WindowsPrincipal($currentIdentity)

if (-not $principal.IsInRole(
    [Security.Principal.WindowsBuiltInRole]::Administrator
)) {
    Write-Error "This script must run as Administrator."
    exit 1
}

Write-Host ""
Write-Host "Installing IIS features..."

# Core IIS + common features
$features = @(
    "Web-Server",
    "Web-WebServer",
    "Web-Common-Http",
    "Web-Default-Doc",
    "Web-Dir-Browsing",
    "Web-Http-Errors",
    "Web-Static-Content",
    "Web-Http-Logging",
    "Web-Request-Monitor",
    "Web-Http-Tracing",
    "Web-Performance",
    "Web-Stat-Compression",
    "Web-Security",
    "Web-Filtering",
    "Web-Mgmt-Tools",
    "Web-Mgmt-Console"
)

foreach ($feature in $features) {

    Write-Host "Installing: $feature"

    try {
        Install-WindowsFeature `
            -Name $feature `
            -IncludeManagementTools `
            -ErrorAction Stop

        Write-Host "OK: $feature"
    }
    catch {
        Write-Warning "Could not install $feature"
        Write-Warning $_.Exception.Message
    }
}

Write-Host ""
Write-Host "============================================"
Write-Host " IIS installation finished"
Write-Host "============================================"

# Check IIS
Write-Host ""
Write-Host "Checking IIS..."

$iis = Get-WindowsFeature -Name Web-Server

if ($iis.Installed) {
    Write-Host "IIS is installed successfully."
}
else {
    Write-Error "IIS installation failed."
    exit 1
}

# Check IIS service
Write-Host ""
Write-Host "Checking W3SVC service..."

$w3svc = Get-Service -Name W3SVC -ErrorAction SilentlyContinue

if ($null -ne $w3svc) {

    if ($w3svc.Status -ne "Running") {
        Start-Service W3SVC
    }

    Write-Host "W3SVC status: $((Get-Service W3SVC).Status)"
}
else {
    Write-Warning "W3SVC service was not found."
}

# Test localhost
Write-Host ""
Write-Host "Testing IIS..."

try {
    $response = Invoke-WebRequest `
        -Uri "http://localhost" `
        -UseBasicParsing `
        -TimeoutSec 10

    Write-Host "IIS HTTP test: SUCCESS"
    Write-Host "HTTP Status: $($response.StatusCode)"
}
catch {
    Write-Warning "IIS HTTP test failed:"
    Write-Warning $_.Exception.Message
}

Write-Host ""
Write-Host "============================================"
Write-Host " DONE"
Write-Host "============================================"
