name: Windows 11 - RDP + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Write-Host "============================================"
          Write-Host "Configuring Windows RDP"
          Write-Host "============================================"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {
              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword
          }
          else {
              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. Download TightVNC
      # ============================================================
      - name: Download TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
              throw "TightVNC installer was not downloaded."
          }

          Write-Host "TightVNC downloaded."

      # ============================================================
      # 3. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"
          $VncPassword = "MyVNC123"

          $Arguments = @(
              "/i"
              "`"$Installer`""
              "/quiet"
              "/norestart"
              "ADDLOCAL=Server"
              "SERVER_REGISTER_AS_SERVICE=1"
              "SERVER_ADD_FIREWALL_EXCEPTION=1"
              "SET_ACCEPTRFBCONNECTIONS=1"
              "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
              "SET_USEVNCAUTHENTICATION=1"
              "VALUE_OF_USEVNCAUTHENTICATION=1"
              "SET_PASSWORD=1"
              "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList $Arguments `
              -Wait `
              -PassThru `
              -NoNewWindow

          if ($Process.ExitCode -ne 0) {
              throw "TightVNC installation failed with exit code $($Process.ExitCode)."
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 4. Start TightVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
              throw "TightVNC executable was not found."
          }

          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue

          if ($Service) {

              Write-Host "TightVNC service: $($Service.Status)"

              if ($Service.Status -ne "Running") {

                  Start-Service `
                      -Name "tvnserver" `
                      -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 3
              }
          }

          Write-Host "TightVNC started."

      # ============================================================
      # 5. Verify TightVNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 5900 `
                  -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {

                  Write-Host "VNC is listening on 127.0.0.1:5900"

                  $Ready = $true
                  break
              }

              Write-Host "Waiting for VNC... $i/30"

              Start-Sleep -Seconds 2
          }

          if (!$Ready) {
              throw "VNC server is not listening on port 5900."
          }

      # ============================================================
      # 6. Download noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
              Remove-Item `
                  $NoVncPath `
                  -Recurse `
                  -Force
          }

          git clone `
              --depth 1 `
              https://github.com/novnc/noVNC.git `
              $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
              throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 7. Install websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing websockify"
          Write-Host "============================================"

          $PythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$PythonCommand) {

              Write-Host "Python not found. Installing Python 3.12."

              winget install `
                  --id Python.Python.3.12 `
                  --exact `
                  --silent `
                  --accept-package-agreements `
                  --accept-source-agreements

              Start-Sleep -Seconds 5
          }

          $PythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$PythonCommand) {
              throw "Python was not found."
          }

          $PythonPath = $PythonCommand.Source

          Write-Host "Python: $PythonPath"

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          $PythonDirectory = Split-Path $PythonPath
          $ScriptsDirectory = Join-Path $PythonDirectory "Scripts"
          $Websockify = Join-Path $ScriptsDirectory "websockify.exe"

          if (!(Test-Path $Websockify)) {

              $WebsockifyCommand = Get-Command `
                  websockify.exe `
                  -ErrorAction SilentlyContinue

              if (!$WebsockifyCommand) {
                  throw "websockify.exe was not found."
              }

              $Websockify = $WebsockifyCommand.Source
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      # ============================================================
      # 8. Start noVNC / websockify
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE

          $Log = "$NoVncPath\websockify.log"

          Remove-Item `
              $Log `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "websockify:"
          Write-Host $Websockify

          Write-Host ""
          Write-Host "Starting websockify..."
          Write-Host ""

          # Explicitly bind the HTTP/WebSocket service to IPv4 localhost.
          #
          # 127.0.0.1:6080
          #       |
          #       +---- HTTP -> C:\noVNC
          #       |
          #       +---- WebSocket -> 127.0.0.1:5900
          #
          Start-Process `
              -FilePath $Websockify `
              -ArgumentList @(
                  "--web"
                  $NoVncPath
                  "--verbose"
                  "127.0.0.1:6080"
                  "127.0.0.1:5900"
              ) `
              -WorkingDirectory $NoVncPath `
              -RedirectStandardOutput $Log `
              -RedirectStandardError "$NoVncPath\websockify-error.log" `
              -WindowStyle Hidden

          Start-Sleep -Seconds 5

          # --------------------------------------------------------
          # Check TCP
          # --------------------------------------------------------

          $TcpReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 6080 `
                  -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {

                  Write-Host ""
                  Write-Host "TCP 6080 is listening."

                  $TcpReady = $true
                  break
              }

              Write-Host "Waiting for TCP 6080... $i/30"

              Start-Sleep -Seconds 2
          }

          if (!$TcpReady) {

              Write-Host ""
              Write-Host "========== websockify stdout =========="

              if (Test-Path $Log) {
                  Get-Content $Log
              }

              Write-Host ""
              Write-Host "========== websockify stderr =========="

              if (Test-Path "$NoVncPath\websockify-error.log") {
                  Get-Content "$NoVncPath\websockify-error.log"
              }

              throw "websockify did not open TCP port 6080."
          }

          # --------------------------------------------------------
          # Check actual HTTP.
          # This is the important test for the Cloudflare 502 issue.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Testing local HTTP:"
          Write-Host "http://127.0.0.1:6080/vnc.html"
          Write-Host ""

          $HttpReady = $false
          $LastHttpError = ""

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $Response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:6080/vnc.html" `
                      -UseBasicParsing `
                      -TimeoutSec 10 `
                      -MaximumRedirection 5

                  Write-Host "HTTP status: $($Response.StatusCode)"

                  if ($Response.StatusCode -eq 200) {

                      if (
                          $Response.Content -match "noVNC" -or
                          $Response.Content -match "<!DOCTYPE html"
                      ) {
                          $HttpReady = $true
                          break
                      }
                  }
              }
              catch {

                  $LastHttpError = $_.Exception.Message

                  Write-Host "HTTP test failed: $LastHttpError"
              }

              Start-Sleep -Seconds 2
          }

          if (!$HttpReady) {

              Write-Host ""
              Write-Host "============================================"
              Write-Host "LOCAL HTTP TEST FAILED"
              Write-Host "============================================"
              Write-Host ""

              if ($LastHttpError) {
                  Write-Host "Last error:"
                  Write-Host $LastHttpError
                  Write-Host ""
              }

              Write-Host "========== websockify stdout =========="

              if (Test-Path $Log) {
                  Get-Content $Log
              }

              Write-Host ""
              Write-Host "========== websockify stderr =========="

              if (Test-Path "$NoVncPath\websockify-error.log") {
                  Get-Content "$NoVncPath\websockify-error.log"
              }

              throw "Port 6080 is open, but /vnc.html is not being served."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL noVNC HTTP TEST PASSED"
          Write-Host "============================================"
          Write-Host ""

      # ============================================================
      # 9. Download cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading cloudflared"
          Write-Host "============================================"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
              -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
              -OutFile $Cloudflared `
              -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
              throw "cloudflared download failed."
          }

          Write-Host "cloudflared version:"
          & $Cloudflared version

      # ============================================================
      # 10. Cloudflare connectivity diagnostics
      # ============================================================
      - name: Diagnose Cloudflare connectivity
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Cloudflare connectivity test"
          Write-Host "============================================"
          Write-Host ""

          Write-Host "DNS:"
          Resolve-DnsName `
              region1.v2.argotunnel.com `
              -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "TCP 7844:"

          $TcpResult = Test-NetConnection `
              region1.v2.argotunnel.com `
              -Port 7844 `
              -WarningAction SilentlyContinue

          $TcpResult |
              Format-List

          Write-Host ""

          if ($TcpResult.TcpTestSucceeded) {
              Write-Host "TCP 7844 is reachable."
          }
          else {
              Write-Host "WARNING: TCP 7844 is not reachable."
          }

      # ============================================================
      # 11. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"
          $Origin = "http://127.0.0.1:6080"

          $Stdout = "C:\cloudflared-stdout.log"
          $Stderr = "C:\cloudflared-stderr.log"

          Remove-Item `
              $Stdout `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              $Stderr `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Origin:"
          Write-Host $Origin
          Write-Host ""
          Write-Host "Protocol: auto"
          Write-Host "Edge IP version: IPv4"
          Write-Host ""

          $TunnelProcess = Start-Process `
              -FilePath $Cloudflared `
              -ArgumentList @(
                  "tunnel"
                  "--no-autoupdate"
                  "--protocol"
                  "auto"
                  "--edge-ip-version"
                  "4"
                  "--http-host-header"
                  "127.0.0.1:6080"
                  "--url"
                  $Origin
              ) `
              -RedirectStandardOutput $Stdout `
              -RedirectStandardError $Stderr `
              -WindowStyle Hidden `
              -PassThru

          Write-Host "cloudflared PID: $($TunnelProcess.Id)"
          Write-Host ""

          $TunnelUrl = $null
          $Registered = $false

          for ($i = 1; $i -le 90; $i++) {

              Start-Sleep -Seconds 2

              if ($TunnelProcess.HasExited) {

                  Write-Host ""
                  Write-Host "cloudflared exited."
                  Write-Host "Exit code: $($TunnelProcess.ExitCode)"

                  break
              }

              $Content = ""

              if (Test-Path $Stdout) {
                  $Content += "`n" + (
                      Get-Content `
                          $Stdout `
                          -Raw `
                          -ErrorAction SilentlyContinue
                  )
              }

              if (Test-Path $Stderr) {
                  $Content += "`n" + (
                      Get-Content `
                          $Stderr `
                          -Raw `
                          -ErrorAction SilentlyContinue
                  )
              }

              if (!$TunnelUrl) {

                  $Match = [regex]::Match(
                      $Content,
                      'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                  )

                  if ($Match.Success) {
                      $TunnelUrl = $Match.Value
                  }
              }

              if ($Content -match "Registered tunnel connection") {
                  $Registered = $true
              }

              if ($TunnelUrl) {
                  Write-Host "Tunnel URL detected: $TunnelUrl"
              }

              if ($Registered) {
                  Write-Host "Cloudflare tunnel connection registered."
                  break
              }

              Write-Host "Waiting for Cloudflare edge connection... $i/90"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "cloudflared output"
          Write-Host "============================================"
          Write-Host ""

          if (Test-Path $Stdout) {

              Write-Host "---------- STDOUT ----------"

              Get-Content $Stdout
          }

          if (Test-Path $Stderr) {

              Write-Host ""
              Write-Host "---------- STDERR ----------"

              Get-Content $Stderr
          }

          if (!$TunnelUrl) {
              throw "Cloudflare did not create a Quick Tunnel URL."
          }

          if (!$Registered) {
              throw "Cloudflare created a URL but no tunnel connection was registered."
          }

          $NoVncUrl = "$TunnelUrl/vnc.html"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "RDP PASSWORD:"
          Write-Host "WindowsRDP#2025"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          # --------------------------------------------------------
          # Verify the public HTTP endpoint.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Testing public noVNC URL..."
          Write-Host ""

          $PublicReady = $false
          $LastPublicError = ""

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $Response = Invoke-WebRequest `
                      -Uri $NoVncUrl `
                      -UseBasicParsing `
                      -TimeoutSec 15 `
                      -MaximumRedirection 5

                  Write-Host "Public HTTP status: $($Response.StatusCode)"

                  if ($Response.StatusCode -eq 200) {
                      $PublicReady = $true
                      break
                  }
              }
              catch {

                  $LastPublicError = $_.Exception.Message

                  Write-Host "Public HTTP test failed:"
                  Write-Host $LastPublicError
              }

              Start-Sleep -Seconds 3
          }

          if (!$PublicReady) {

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "PUBLIC noVNC TEST FAILED"
              Write-Host "============================================================"
              Write-Host ""

              Write-Host "URL:"
              Write-Host $NoVncUrl
              Write-Host ""

              Write-Host "Last error:"
              Write-Host $LastPublicError
              Write-Host ""

              Write-Host "The tunnel is connected, but the origin request failed."
              Write-Host ""

              Write-Host "========== websockify stdout =========="

              if (Test-Path "C:\noVNC\websockify.log") {
                  Get-Content "C:\noVNC\websockify.log"
              }

              Write-Host ""
              Write-Host "========== websockify stderr =========="

              if (Test-Path "C:\noVNC\websockify-error.log") {
                  Get-Content "C:\noVNC\websockify-error.log"
              }

              Write-Host ""
              Write-Host "========== cloudflared stdout =========="

              Get-Content $Stdout -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "========== cloudflared stderr =========="

              Get-Content $Stderr -ErrorAction SilentlyContinue

              throw "Cloudflare tunnel is connected, but public noVNC returned no HTTP 200."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             PUBLIC noVNC TEST PASSED"
          Write-Host "============================================================"
          Write-Host ""

          # --------------------------------------------------------
          # Keep runner + VNC + websockify + cloudflared alive.
          # --------------------------------------------------------

          while ($true) {

              Start-Sleep -Seconds 30

              $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              if ($TunnelProcess.HasExited) {

                  Write-Host ""
                  Write-Host "cloudflared stopped at $Now."
                  Write-Host ""

                  Write-Host "========== cloudflared stdout =========="
                  Get-Content $Stdout -ErrorAction SilentlyContinue

                  Write-Host ""
                  Write-Host "========== cloudflared stderr =========="
                  Get-Content $Stderr -ErrorAction SilentlyContinue

                  throw "cloudflared stopped while the session was active."
              }

              Write-Host "[$Now] Windows + TightVNC + noVNC + Cloudflare alive."
          }
