name: Windows 11 - RDP + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure Windows RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Configuring Windows RDP"
          Write-Host "============================================"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

          } else {

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. Download TightVNC
      # ============================================================
      - name: Download TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
              throw "TightVNC installer was not downloaded."
          }

          Write-Host "TightVNC downloaded."

      # ============================================================
      # 3. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          # TightVNC password: maximum 8 characters
          $VncPassword = "MyVNC123"

          $Arguments = @(
              "/i"
              "`"$Installer`""
              "/quiet"
              "/norestart"
              "ADDLOCAL=Server"
              "SERVER_REGISTER_AS_SERVICE=1"
              "SERVER_ADD_FIREWALL_EXCEPTION=1"
              "SET_ACCEPTRFBCONNECTIONS=1"
              "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
              "SET_USEVNCAUTHENTICATION=1"
              "VALUE_OF_USEVNCAUTHENTICATION=1"
              "SET_PASSWORD=1"
              "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList $Arguments `
              -Wait `
              -PassThru `
              -NoNewWindow

          if ($Process.ExitCode -ne 0) {
              throw "TightVNC installation failed with exit code $($Process.ExitCode)."
          }

          Write-Host "TightVNC installed."

      # ============================================================
      # 4. Start TightVNC
      # ============================================================
      - name: Start TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
              throw "TightVNC executable was not found."
          }

          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 3

          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue

          if ($Service) {

              Write-Host "TightVNC service: $($Service.Status)"

              if ($Service.Status -ne "Running") {

                  Start-Service `
                      -Name "tvnserver" `
                      -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 3
              }
          }

          Write-Host "TightVNC started."

      # ============================================================
      # 5. Verify VNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 5900 `
                  -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {

                  Write-Host "VNC is listening on 127.0.0.1:5900"

                  $Ready = $true
                  break
              }

              Write-Host "Waiting for VNC... $i/30"

              Start-Sleep -Seconds 2
          }

          if (!$Ready) {
              throw "VNC server is not listening on port 5900."
          }

      # ============================================================
      # 6. Download noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
              Remove-Item `
                  $NoVncPath `
                  -Recurse `
                  -Force
          }

          git clone `
              --depth 1 `
              https://github.com/novnc/noVNC.git `
              $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
              throw "noVNC installation failed."
          }

          if (!(Test-Path "$NoVncPath\utils\novnc_proxy")) {
              throw "noVNC novnc_proxy script was not found."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 7. Install Python
      #    Git Bash + novnc_proxy will use Python/websockify.
      # ============================================================
      - name: Prepare Python and websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Preparing Python / websockify"
          Write-Host "============================================"

          $PythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$PythonCommand) {

              Write-Host "Python not found. Installing Python 3.12."

              winget install `
                  --id Python.Python.3.12 `
                  --exact `
                  --silent `
                  --accept-package-agreements `
                  --accept-source-agreements

              Start-Sleep -Seconds 5
          }

          $PythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$PythonCommand) {
              throw "Python was not found."
          }

          $PythonPath = $PythonCommand.Source

          Write-Host "Python: $PythonPath"

          & $PythonPath -m pip install --upgrade pip
          & $PythonPath -m pip install websockify

          $PythonDirectory = Split-Path $PythonPath
          $ScriptsDirectory = Join-Path $PythonDirectory "Scripts"
          $Websockify = Join-Path $ScriptsDirectory "websockify.exe"

          if (!(Test-Path $Websockify)) {

              $WebsockifyCommand = Get-Command `
                  websockify.exe `
                  -ErrorAction SilentlyContinue

              if (!$WebsockifyCommand) {
                  throw "websockify.exe was not found."
              }

              $Websockify = $WebsockifyCommand.Source
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV
          "PYTHON_EXE=$PythonPath" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      # ============================================================
      # 8. Start official noVNC novnc_proxy through Git Bash
      #
      # noVNC's official novnc_proxy:
      #   - runs the web server
      #   - runs the WebSocket proxy
      #   - serves vnc.html
      #
      # We use Git Bash because novnc_proxy is a shell script.
      # ============================================================
      - name: Start official noVNC proxy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting official noVNC proxy"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"

          $Bash = "C:\Program Files\Git\bin\bash.exe"

          if (!(Test-Path $Bash)) {
              throw "Git Bash was not found at $Bash"
          }

          $Stdout = "$NoVncPath\novnc-proxy-stdout.log"
          $Stderr = "$NoVncPath\novnc-proxy-stderr.log"

          Remove-Item `
              $Stdout `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              $Stderr `
              -Force `
              -ErrorAction SilentlyContinue

          #
          # Use the official noVNC helper:
          #
          # novnc_proxy
          #   --vnc 127.0.0.1:5900
          #   --listen 127.0.0.1:6080
          #
          # It starts websockify + the mini web server together.
          #

          $Command = @"
cd /c/noVNC
export PATH="/c/Program Files/Python312:/c/hostedtoolcache/windows/Python/3.12.10/x64:/c/hostedtoolcache/windows/Python/3.12.10/x64/Scripts:`$PATH"
bash ./utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 127.0.0.1:6080 --file-only
"@

          Write-Host "Starting Git Bash noVNC proxy..."

          Start-Process `
              -FilePath $Bash `
              -ArgumentList @(
                  "--noprofile"
                  "--norc"
                  "-lc"
                  $Command
              ) `
              -WorkingDirectory $NoVncPath `
              -RedirectStandardOutput $Stdout `
              -RedirectStandardError $Stderr `
              -WindowStyle Hidden

          Start-Sleep -Seconds 6

          # --------------------------------------------------------
          # TCP test
          # --------------------------------------------------------

          $TcpReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $Result = Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 6080 `
                  -WarningAction SilentlyContinue

              if ($Result.TcpTestSucceeded) {

                  Write-Host "noVNC proxy is listening on 127.0.0.1:6080"

                  $TcpReady = $true
                  break
              }

              Write-Host "Waiting for noVNC proxy... $i/30"

              Start-Sleep -Seconds 2
          }

          if (!$TcpReady) {

              Write-Host ""
              Write-Host "========== noVNC proxy stdout =========="

              if (Test-Path $Stdout) {
                  Get-Content $Stdout
              }

              Write-Host ""
              Write-Host "========== noVNC proxy stderr =========="

              if (Test-Path $Stderr) {
                  Get-Content $Stderr
              }

              throw "noVNC proxy did not open port 6080."
          }

          # --------------------------------------------------------
          # Actual HTTP test
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Testing local noVNC HTTP..."
          Write-Host ""

          $HttpReady = $false

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $Response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:6080/vnc.html" `
                      -UseBasicParsing `
                      -TimeoutSec 10

                  Write-Host "Local HTTP status: $($Response.StatusCode)"

                  if ($Response.StatusCode -eq 200) {

                      if (
                          $Response.Content -match "noVNC" -or
                          $Response.Content -match "<!DOCTYPE html"
                      ) {
                          $HttpReady = $true
                          break
                      }
                  }

              }
              catch {

                  Write-Host "Local HTTP failed:"
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 2
          }

          if (!$HttpReady) {

              Write-Host ""
              Write-Host "========== noVNC proxy stdout =========="

              if (Test-Path $Stdout) {
                  Get-Content $Stdout
              }

              Write-Host ""
              Write-Host "========== noVNC proxy stderr =========="

              if (Test-Path $Stderr) {
                  Get-Content $Stderr
              }

              throw "noVNC proxy is listening but /vnc.html did not return HTTP 200."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "LOCAL noVNC TEST PASSED"
          Write-Host "============================================"

      # ============================================================
      # 9. Install cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading cloudflared"
          Write-Host "============================================"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
              -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
              -OutFile $Cloudflared `
              -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
              throw "cloudflared download failed."
          }

          & $Cloudflared version

      # ============================================================
      # 10. Cloudflare connectivity test
      # ============================================================
      - name: Diagnose Cloudflare connectivity
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Cloudflare connectivity"
          Write-Host "============================================"
          Write-Host ""

          Resolve-DnsName `
              region1.v2.argotunnel.com `
              -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "TCP 7844:"

          $Tcp = Test-NetConnection `
              region1.v2.argotunnel.com `
              -Port 7844 `
              -WarningAction SilentlyContinue

          $Tcp | Format-List

          if (!$Tcp.TcpTestSucceeded) {
              Write-Host ""
              Write-Host "WARNING: TCP 7844 is not reachable."
          }

      # ============================================================
      # 11. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Cloudflared = "C:\cloudflared.exe"
          $Origin = "http://127.0.0.1:6080"

          $Stdout = "C:\cloudflared-stdout.log"
          $Stderr = "C:\cloudflared-stderr.log"
          $DebugLog = "C:\cloudflared-debug.log"

          Remove-Item `
              $Stdout `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              $Stderr `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              $DebugLog `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Origin: $Origin"
          Write-Host ""

          #
          # Important:
          # - No --http-host-header override
          # - IPv4 edge
          # - automatic QUIC/HTTP2 selection
          # - DEBUG log retained for real 502 diagnosis
          #

          $TunnelProcess = Start-Process `
              -FilePath $Cloudflared `
              -ArgumentList @(
                  "tunnel"
                  "--no-autoupdate"
                  "--protocol"
                  "auto"
                  "--edge-ip-version"
                  "4"
                  "--loglevel"
                  "debug"
                  "--logfile"
                  $DebugLog
                  "--url"
                  $Origin
              ) `
              -RedirectStandardOutput $Stdout `
              -RedirectStandardError $Stderr `
              -WindowStyle Hidden `
              -PassThru

          Write-Host "cloudflared PID: $($TunnelProcess.Id)"
          Write-Host ""

          $TunnelUrl = $null
          $Registered = $false

          for ($i = 1; $i -le 90; $i++) {

              Start-Sleep -Seconds 2

              if ($TunnelProcess.HasExited) {

                  Write-Host ""
                  Write-Host "cloudflared exited."
                  Write-Host "Exit code: $($TunnelProcess.ExitCode)"

                  break
              }

              $Content = ""

              if (Test-Path $Stdout) {
                  $Content += "`n" + (
                      Get-Content `
                          $Stdout `
                          -Raw `
                          -ErrorAction SilentlyContinue
                  )
              }

              if (Test-Path $Stderr) {
                  $Content += "`n" + (
                      Get-Content `
                          $Stderr `
                          -Raw `
                          -ErrorAction SilentlyContinue
                  )
              }

              if (Test-Path $DebugLog) {
                  $Content += "`n" + (
                      Get-Content `
                          $DebugLog `
                          -Raw `
                          -ErrorAction SilentlyContinue
                  )
              }

              if (!$TunnelUrl) {

                  $Match = [regex]::Match(
                      $Content,
                      'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                  )

                  if ($Match.Success) {
                      $TunnelUrl = $Match.Value
                  }
              }

              if ($Content -match "Registered tunnel connection") {
                  $Registered = $true
              }

              if ($TunnelUrl) {
                  Write-Host "Tunnel URL detected: $TunnelUrl"
              }

              if ($Registered) {
                  Write-Host "Cloudflare tunnel connection registered."
                  break
              }

              Write-Host "Waiting for Cloudflare edge... $i/90"
          }

          if (!$TunnelUrl) {

              Write-Host ""
              Write-Host "========== cloudflared stdout =========="

              Get-Content `
                  $Stdout `
                  -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "========== cloudflared stderr =========="

              Get-Content `
                  $Stderr `
                  -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "========== cloudflared debug =========="

              Get-Content `
                  $DebugLog `
                  -Tail 150 `
                  -ErrorAction SilentlyContinue

              throw "Cloudflare Quick Tunnel URL was not created."
          }

          if (!$Registered) {

              Write-Host ""
              Write-Host "========== cloudflared debug =========="

              Get-Content `
                  $DebugLog `
                  -Tail 150 `
                  -ErrorAction SilentlyContinue

              throw "Cloudflare Quick Tunnel URL was created, but the tunnel connection was not registered."
          }

          $NoVncUrl = "$TunnelUrl/vnc.html"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "RDP USER:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "RDP PASSWORD:"
          Write-Host "WindowsRDP#2025"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          # --------------------------------------------------------
          # Wait briefly for the Quick Tunnel hostname to propagate.
          # Cloudflare says it may take some time to become reachable.
          # --------------------------------------------------------

          Start-Sleep -Seconds 8

          # --------------------------------------------------------
          # Public HTTP test
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Testing public noVNC URL..."
          Write-Host ""

          $PublicReady = $false
          $LastStatus = $null
          $LastError = ""

          for ($i = 1; $i -le 20; $i++) {

              try {

                  $Response = Invoke-WebRequest `
                      -Uri $NoVncUrl `
                      -UseBasicParsing `
                      -TimeoutSec 15 `
                      -MaximumRedirection 5

                  $LastStatus = [int]$Response.StatusCode

                  Write-Host "Public HTTP status: $LastStatus"

                  if ($LastStatus -eq 200) {
                      $PublicReady = $true
                      break
                  }

              }
              catch {

                  $LastError = $_.Exception.Message

                  Write-Host "Public request failed:"
                  Write-Host $LastError
              }

              Start-Sleep -Seconds 3
          }

          if (!$PublicReady) {

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "                 PUBLIC TEST FAILED"
              Write-Host "============================================================"
              Write-Host ""

              Write-Host "URL:"
              Write-Host $NoVncUrl
              Write-Host ""

              Write-Host "Last HTTP status:"
              Write-Host $LastStatus
              Write-Host ""

              Write-Host "Last request error:"
              Write-Host $LastError
              Write-Host ""

              Write-Host "============================================================"
              Write-Host "                    DEBUG LOG"
              Write-Host "============================================================"
              Write-Host ""

              if (Test-Path $DebugLog) {
                  Get-Content `
                      $DebugLog `
                      -Tail 250
              }

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "                 noVNC PROXY LOG"
              Write-Host "============================================================"
              Write-Host ""

              if (Test-Path "C:\noVNC\novnc-proxy-stdout.log") {
                  Get-Content `
                      "C:\noVNC\novnc-proxy-stdout.log" `
                      -Tail 150
              }

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "                noVNC PROXY ERRORS"
              Write-Host "============================================================"
              Write-Host ""

              if (Test-Path "C:\noVNC\novnc-proxy-stderr.log") {
                  Get-Content `
                      "C:\noVNC\novnc-proxy-stderr.log" `
                      -Tail 150
              }

              throw "Public noVNC endpoint did not return HTTP 200."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             PUBLIC noVNC TEST PASSED"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""

          # --------------------------------------------------------
          # Keep the Windows session, VNC, noVNC and cloudflared alive.
          # --------------------------------------------------------

          while ($true) {

              Start-Sleep -Seconds 30

              $Now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              if ($TunnelProcess.HasExited) {

                  Write-Host ""
                  Write-Host "cloudflared stopped at $Now."
                  Write-Host ""

                  Write-Host "========== cloudflared debug =========="

                  if (Test-Path $DebugLog) {
                      Get-Content `
                          $DebugLog `
                          -Tail 250
                  }

                  throw "cloudflared stopped while the session was active."
              }

              Write-Host "[$Now] Windows + TightVNC + noVNC + Cloudflare alive."
          }
