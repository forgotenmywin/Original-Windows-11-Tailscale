name: Browser RDP via Myrtille (No Docker)

on:
  workflow_dispatch:

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP Service & User
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Configuring Remote Desktop"
          Write-Host "=========================================="

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Enable RDP firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Start RDP service
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          # RDP credentials
          $runnerAdminPass = "WindowsRDP#2025"

          # Set password
          net user runneradmin "$runnerAdminPass"

          # Make sure account is enabled
          net user runneradmin /active:yes

          # Save variables
          "RDP_USER=runneradmin" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "RDP_PASS=$runnerAdminPass" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "RDP configuration completed."


      # ============================================================
      # 2. Install IIS
      # ============================================================
      - name: Install IIS
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Installing IIS"
          Write-Host "=========================================="

          Import-Module ServerManager

          # Main IIS role
          Install-WindowsFeature `
            -Name Web-Server `
            -IncludeManagementTools

          # IIS components
          $features = @(
            "Web-Common-Http",
            "Web-Default-Doc",
            "Web-Static-Content",
            "Web-Http-Errors",
            "Web-Http-Logging",
            "Web-Request-Monitor",
            "Web-Filtering",
            "Web-Windows-Auth",
            "Web-Mgmt-Console"
          )

          foreach ($feature in $features) {

            Write-Host ""
            Write-Host "Installing $feature ..."

            try {

              Install-WindowsFeature `
                -Name $feature `
                -ErrorAction Stop

            }
            catch {

              Write-Host "::warning::Could not install $feature"
              Write-Host $_.Exception.Message
            }
          }

          Write-Host ""
          Write-Host "IIS installation completed."


      # ============================================================
      # 3. ASP.NET / .NET Framework IIS components
      # ============================================================
      - name: Install ASP.NET and .NET IIS Components
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Installing ASP.NET / .NET components"
          Write-Host "=========================================="

          Import-Module ServerManager

          $features = @(
            "Web-Asp-Net45",
            "Web-Net-Ext45",
            "Web-ISAPI-Ext",
            "Web-ISAPI-Filter"
          )

          foreach ($feature in $features) {

            Write-Host ""
            Write-Host "Installing $feature ..."

            try {

              Install-WindowsFeature `
                -Name $feature `
                -ErrorAction Stop

            }
            catch {

              Write-Host "::warning::Could not install $feature"
              Write-Host $_.Exception.Message
            }
          }

          Write-Host ""
          Write-Host "ASP.NET components completed."


      # ============================================================
      # 4. WCF HTTP Activation
      # ============================================================
      - name: Enable WCF HTTP Activation
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Enabling WCF HTTP Activation"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Windows version:"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host ""
          Write-Host "Running DISM..."

          & dism.exe /online /enable-feature `
            /featurename:WCF-HTTP-Activation45 `
            /all `
            /norestart

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "WCF-HTTP-Activation45 failed."
            Write-Host "Trying legacy WCF-HTTP-Activation..."

            & dism.exe /online /enable-feature `
              /featurename:WCF-HTTP-Activation `
              /all `
              /norestart

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not enable WCF HTTP Activation."
              exit 1
            }
          }

          Write-Host ""
          Write-Host "WCF activation completed successfully."


      # ============================================================
      # 5. Verify IIS / ASP.NET / WCF
      # ============================================================
      - name: Verify IIS Components
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Verifying IIS Components"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "=== Installed IIS / .NET Features ==="

          Get-WindowsFeature |
            Where-Object {
              $_.Name -like "Web-*" -or
              $_.Name -like "*WCF*" -or
              $_.Name -like "*NET*"
            } |
            Format-Table Name, InstallState

          # --------------------------------------------------------
          # IIS version
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== IIS Version ==="

          $iisPath = "HKLM:\SOFTWARE\Microsoft\InetStp"

          if (Test-Path $iisPath) {

            $iisInfo = Get-ItemProperty $iisPath

            Write-Host "IIS Major Version : $($iisInfo.MajorVersion)"
            Write-Host "IIS Minor Version : $($iisInfo.MinorVersion)"
            Write-Host "IIS Version       : $($iisInfo.VersionString)"
          }
          else {

            Write-Host "::warning::IIS registry information not found."
          }

          # --------------------------------------------------------
          # IIS AppCmd
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== IIS Sites ==="

          $appcmd = "$env:SystemRoot\System32\inetsrv\appcmd.exe"

          if (Test-Path $appcmd) {

            & $appcmd list site

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Could not list IIS sites."
            }
          }
          else {

            Write-Host "::error::appcmd.exe not found."
            exit 1
          }

          # --------------------------------------------------------
          # ASP.NET
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== ASP.NET Registration ==="

          $aspnetReg = `
            "$env:windir\Microsoft.NET\Framework64\v4.0.30319\aspnet_regiis.exe"

          if (Test-Path $aspnetReg) {

            Write-Host "ASP.NET 4.x detected."
            Write-Host "Path: $aspnetReg"

          }
          else {

            Write-Host "::warning::ASP.NET registration executable not found."
          }

          # --------------------------------------------------------
          # WCF
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== WCF HTTP Activation ==="

          $wcf = Get-WindowsFeature NET-WCF-HTTP-Activation45

          if ($wcf.InstallState -eq "Installed") {

            Write-Host "WCF HTTP Activation: INSTALLED"

          }
          else {

            Write-Host "::error::WCF HTTP Activation is NOT installed."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " IIS verification completed successfully"
          Write-Host "=========================================="


      # ============================================================
      # 6. Download Myrtille
      # ============================================================
      - name: Download Myrtille
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Downloading Myrtille"
          Write-Host "=========================================="

          $myrtilleUrl = `
            "https://downloads.hostingcontroller.com/misc/utilities/Myrtille_2.9.2_x86_x64_Setup.msi"

          $myrtilleMsi = `
            "$env:RUNNER_TEMP\MyrtilleSetup.msi"

          Invoke-WebRequest `
            -Uri $myrtilleUrl `
            -OutFile $myrtilleMsi `
            -UseBasicParsing

          if (!(Test-Path $myrtilleMsi)) {

            Write-Host "::error::Myrtille MSI download failed."
            exit 1
          }

          $size = `
            (Get-Item $myrtilleMsi).Length

          Write-Host ""
          Write-Host "Myrtille downloaded."
          Write-Host "File size: $size bytes"


      # ============================================================
      # 7. Install Myrtille
      # ============================================================
      - name: Install Myrtille
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Installing Myrtille"
          Write-Host "=========================================="

          $msi = "$env:RUNNER_TEMP\MyrtilleSetup.msi"
          $log = "$env:RUNNER_TEMP\myrtille-install.log"

          $arguments = @(
            "/i",
            "`"$msi`"",
            "/quiet",
            "/norestart",
            "/l*v",
            "`"$log`""
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MSI Exit Code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {

            Write-Host "::error::Myrtille installation failed."

            if (Test-Path $log) {

              Write-Host ""
              Write-Host "=== Myrtille installer log ==="

              Get-Content $log -Tail 150
            }

            exit 1
          }

          Write-Host ""
          Write-Host "Myrtille installed successfully."


      # ============================================================
      # 8. Locate Myrtille
      # ============================================================
      - name: Locate Myrtille
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Locating Myrtille"
          Write-Host "=========================================="

          $paths = @(
            "C:\Program Files\Myrtille",
            "C:\Program Files (x86)\Myrtille",
            "C:\Myrtille",
            "C:\inetpub\wwwroot\Myrtille"
          )

          $found = $false

          foreach ($path in $paths) {

            if (Test-Path $path) {

              Write-Host "Found Myrtille:"
              Write-Host $path

              "MYRTILLE_PATH=$path" |
                Out-File -FilePath $env:GITHUB_ENV -Append

              $found = $true

              break
            }
          }

          if (!$found) {

            Write-Host "::error::Myrtille installation directory was not found."

            Write-Host ""
            Write-Host "Searching Program Files..."

            Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "Myrtille"
              } |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }


      # ============================================================
      # 9. Start IIS
      # ============================================================
      - name: Start and Configure IIS
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Starting IIS"
          Write-Host "=========================================="

          Set-Service `
            -Name W3SVC `
            -StartupType Automatic

          Start-Service `
            -Name W3SVC `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=== IIS Sites ==="

          & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list site

          Write-Host ""
          Write-Host "=== IIS Application Pools ==="

          & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list apppool

          Write-Host ""
          Write-Host "=== IIS Applications ==="

          & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list app

          Write-Host ""
          Write-Host "Restarting IIS..."

          iisreset

          Start-Sleep -Seconds 10

          Write-Host "IIS started successfully."


      # ============================================================
      # 10. Detect Myrtille
      # ============================================================
      - name: Detect Myrtille IIS Application
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Detecting Myrtille IIS Application"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "=== IIS Applications ==="

          & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list app

          Write-Host ""
          Write-Host "=== IIS Sites ==="

          & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list site

          Write-Host ""
          Write-Host "Testing Myrtille..."

          $urls = @(
            "http://localhost/Myrtille",
            "http://localhost/myrtille"
          )

          $found = $false

          foreach ($url in $urls) {

            Write-Host ""
            Write-Host "Testing: $url"

            try {

              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 20 `
                -ErrorAction Stop

              Write-Host "HTTP Status: $($response.StatusCode)"

              if ($response.StatusCode -ge 200 -and
                  $response.StatusCode -lt 500) {

                "MYRTILLE_URL=$url" |
                  Out-File -FilePath $env:GITHUB_ENV -Append

                $found = $true

                Write-Host "Myrtille endpoint detected."
                break
              }
            }
            catch {

              Write-Host "Request failed:"
              Write-Host $_.Exception.Message
            }
          }

          if (!$found) {

            Write-Host "::warning::Myrtille endpoint was not detected yet."
            Write-Host "Continuing because IIS may still be configuring the application."
          }


      # ============================================================
      # 11. Download Cloudflared
      # ============================================================
      - name: Download Cloudflare Tunnel
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Downloading Cloudflare Tunnel"
          Write-Host "=========================================="

          $url = `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          $cloudflared = `
            "$env:RUNNER_TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {

            Write-Host "::error::cloudflared download failed."
            exit 1
          }

          Write-Host ""
          Write-Host "cloudflared version:"

          & $cloudflared --version


      # ============================================================
      # 12. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Starting Cloudflare Quick Tunnel"
          Write-Host "=========================================="

          $cloudflared = `
            "$env:RUNNER_TEMP\cloudflared.exe"

          $errLog = `
            "$env:RUNNER_TEMP\cf-err.log"

          $outLog = `
            "$env:RUNNER_TEMP\cf-out.log"

          Remove-Item `
            $errLog,
            $outLog `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:80",
              "--no-autoupdate"
            ) `
            -RedirectStandardError $errLog `
            -RedirectStandardOutput $outLog `
            -WindowStyle Hidden

          $cfURL = $null

          Write-Host ""
          Write-Host "Waiting for Cloudflare URL..."

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            if (Test-Path $errLog) {

              $content = `
                Get-Content $errLog `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($content -match `
                'https://[a-zA-Z0-9\-]+\.trycloudflare\.com') {

                $cfURL = $matches[0]

                break
              }
            }

            Write-Host "Waiting... $i/60"
          }

          if (!$cfURL) {

            Write-Host "::error::Cloudflare URL was not found."

            if (Test-Path $errLog) {

              Write-Host ""
              Write-Host "=== Cloudflare stderr ==="

              Get-Content $errLog -Tail 100
            }

            if (Test-Path $outLog) {

              Write-Host ""
              Write-Host "=== Cloudflare stdout ==="

              Get-Content $outLog -Tail 100
            }

            exit 1
          }

          "CF_URL=$cfURL" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Cloudflare Tunnel Ready"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host $cfURL


      # ============================================================
      # 13. Test Cloudflare
      # ============================================================
      - name: Test Cloudflare Tunnel
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Testing Cloudflare Tunnel"
          Write-Host "=========================================="

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "Cloudflare URL:"
          Write-Host $env:CF_URL

          try {

            $response = Invoke-WebRequest `
              -Uri "$env:CF_URL/" `
              -UseBasicParsing `
              -TimeoutSec 30 `
              -ErrorAction Stop

            Write-Host ""
            Write-Host "HTTP Status: $($response.StatusCode)"

          }
          catch {

            Write-Host ""
            Write-Host "::warning::Cloudflare HTTP test failed."

            Write-Host $_.Exception.Message
          }


      # ============================================================
      # 14. Display connection information
      # ============================================================
      - name: Display Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================================="
          Write-Host "          BROWSER RDP READY"
          Write-Host "================================================="
          Write-Host ""

          Write-Host "Cloudflare URL:"
          Write-Host "$env:CF_URL"

          Write-Host ""

          Write-Host "Myrtille URL:"
          Write-Host "$env:CF_URL/Myrtille"

          Write-Host ""

          Write-Host "RDP Server:"
          Write-Host "localhost"

          Write-Host ""

          Write-Host "Username:"
          Write-Host "$env:RDP_USER"

          Write-Host ""

          Write-Host "Password:"
          Write-Host "$env:RDP_PASS"

          Write-Host ""
          Write-Host "================================================="
          Write-Host ""

          Write-Host "The runner will remain active."


      # ============================================================
      # 15. Keep GitHub Runner Alive
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host "=========================================="

          while ($true) {

            $time = `
              Get-Date `
              -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host ""
            Write-Host "[$time] Session alive..."

            # Check IIS
            $iis = `
              Get-Service W3SVC `
              -ErrorAction SilentlyContinue

            if ($iis) {
              Write-Host "IIS      : $($iis.Status)"
            }

            # Check RDP
            $rdp = `
              Get-Service TermService `
              -ErrorAction SilentlyContinue

            if ($rdp) {
              Write-Host "RDP      : $($rdp.Status)"
            }

            # Check Cloudflare
            $cf = `
              Get-Process cloudflared `
              -ErrorAction SilentlyContinue

            if ($cf) {
              Write-Host "Cloudflare: RUNNING"
            }
            else {
              Write-Host "Cloudflare: NOT RUNNING"
            }

            Start-Sleep -Seconds 300
          }
