name: Windows 11 - noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Configuring Windows RDP"
          Write-Host "============================================"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword

            Write-Host "Updated existing RDP user."

          } else {

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires

            Write-Host "Created RDP user."
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host "RDP configured."

      # ============================================================
      # 2. Install TightVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading TightVNC"
          Write-Host "============================================"

          $Installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer `
            -UseBasicParsing

          if (!(Test-Path $Installer)) {
            throw "TightVNC installer was not downloaded."
          }

          # TightVNC VNC password:
          # maximum 8 characters
          $VncPassword = "MyVNC123"

          Write-Host "Installing TightVNC..."

          $Arguments = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"

            "ADDLOCAL=Server"

            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"

            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $Process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($Process.ExitCode -ne 0) {
            throw "TightVNC installation failed. Exit code: $($Process.ExitCode)"
          }

          Write-Host "TightVNC installation completed."

      # ============================================================
      # 3. Start TightVNC Server
      # ============================================================
      - name: Start TightVNC Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting TightVNC"
          Write-Host "============================================"

          $VncExe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $VncExe)) {
            throw "TightVNC executable not found."
          }

          # Ensure service exists
          & $VncExe -install -silent 2>$null

          Start-Sleep -Seconds 3

          # Start the VNC service
          & $VncExe -start -silent 2>$null

          Start-Sleep -Seconds 5

          $Service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($Service) {

            Write-Host "Service status: $($Service.Status)"

            if ($Service.Status -ne "Running") {

              Start-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
            }
          }

          Write-Host "TightVNC started."

      # ============================================================
      # 4. Verify VNC port
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "Checking VNC port 5900"
          Write-Host "============================================"

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "VNC is listening on 127.0.0.1:5900"

              $Ready = $true
              break
            }

            Write-Host "Waiting for VNC... $i/30"

            Start-Sleep -Seconds 2
          }

          if (!$Ready) {

            Write-Host ""
            Write-Host "TightVNC service:"
            Get-Service `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "TightVNC processes:"
            Get-Process |
              Where-Object {
                $_.ProcessName -match "tvn|vnc"
              } |
              Format-Table -AutoSize

            throw "VNC server is not listening on port 5900."
          }

      # ============================================================
      # 5. Download noVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"

          if (Test-Path $NoVncPath) {
            Remove-Item `
              $NoVncPath `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $NoVncPath

          if (!(Test-Path "$NoVncPath\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # 6. Install Python / websockify
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Installing websockify"
          Write-Host "============================================"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {

            Write-Host "Python not found."

            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            Start-Sleep -Seconds 5
          }

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            throw "Python was not found."
          }

          $PythonPath = $Python.Source

          Write-Host "Python: $PythonPath"

          & $PythonPath -m pip install --upgrade pip

          & $PythonPath -m pip install websockify

          $PythonDir = Split-Path $PythonPath
          $ScriptsDir = Join-Path $PythonDir "Scripts"
          $Websockify = Join-Path $ScriptsDir "websockify.exe"

          if (!(Test-Path $Websockify)) {

            $Command = Get-Command `
              websockify.exe `
              -ErrorAction SilentlyContinue

            if ($Command) {
              $Websockify = $Command.Source
            }
            else {
              throw "websockify.exe was not found."
            }
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

          Write-Host "websockify: $Websockify"

      # ============================================================
      # 7. Start noVNC
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting noVNC"
          Write-Host "============================================"

          $NoVncPath = "C:\noVNC"
          $Websockify = $env:WEBSOCKIFY_EXE

          $Stdout = "$NoVncPath\websockify-stdout.log"
          $Stderr = "$NoVncPath\websockify-stderr.log"

          Remove-Item `
            $Stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $Stderr `
            -Force `
            -ErrorAction SilentlyContinue

          # websockify:
          # 6080 -> 5900
          #
          # --web C:\noVNC
          # serves noVNC's web files
          #
          # 6080
          # browser/WebSocket listener
          #
          # 127.0.0.1:5900
          # TightVNC server
          $Arguments = @(
            "--web"
            $NoVncPath
            "6080"
            "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath $Websockify `
            -ArgumentList $Arguments `
            -WorkingDirectory $NoVncPath `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $Ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $Result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($Result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "noVNC/websockify is listening on 127.0.0.1:6080"

              $Ready = $true
              break
            }

            Write-Host "Waiting for noVNC... $i/30"

            Start-Sleep -Seconds 2
          }

          if (!$Ready) {

            Write-Host ""
            Write-Host "========== websockify stdout =========="

            if (Test-Path $Stdout) {
              Get-Content $Stdout
            }

            Write-Host ""
            Write-Host "========== websockify stderr =========="

            if (Test-Path $Stderr) {
              Get-Content $Stderr
            }

            throw "noVNC/websockify failed to start."
          }

      # ============================================================
      # 8. Download cloudflared
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Downloading cloudflared"
          Write-Host "============================================"

          $Cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $Cloudflared `
            -UseBasicParsing

          if (!(Test-Path $Cloudflared)) {
            throw "cloudflared download failed."
          }

          Write-Host "cloudflared installed."

      # ============================================================
      # 9. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Starting Cloudflare Quick Tunnel"
          Write-Host "============================================"

          $Stdout = "C:\cloudflared-stdout.log"
          $Stderr = "C:\cloudflared-stderr.log"

          Remove-Item `
            $Stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $Stderr `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Tunnel target:"
          Write-Host "http://127.0.0.1:6080"
          Write-Host ""

          Start-Process `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList @(
              "tunnel"
              "--url"
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $Stdout `
            -RedirectStandardError $Stderr `
            -WindowStyle Hidden

          Write-Host "Waiting for trycloudflare.com URL..."

          $Url = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            $Content = ""

            if (Test-Path $Stdout) {
              $Content += "`n" + (
                Get-Content `
                  $Stdout `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            if (Test-Path $Stderr) {
              $Content += "`n" + (
                Get-Content `
                  $Stderr `
                  -Raw `
                  -ErrorAction SilentlyContinue
              )
            }

            $Match = [regex]::Match(
              $Content,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($Match.Success) {
              $Url = $Match.Value
              break
            }

            Write-Host "Waiting... $i/60"
          }

          if (!$Url) {

            Write-Host ""
            Write-Host "========== cloudflared stdout =========="

            if (Test-Path $Stdout) {
              Get-Content $Stdout
            }

            Write-Host ""
            Write-Host "========== cloudflared stderr =========="

            if (Test-Path $Stderr) {
              Get-Content $Stderr
            }

            throw "Cloudflare Quick Tunnel URL was not found."
          }

          # noVNC uses /websockify as its WebSocket path by default.
          # Since the Quick Tunnel proxies the same origin, the browser
          # can connect to wss://<tunnel>/websockify.
          #
          # autoconnect=false:
          # Open page first, then press Connect manually.
          $NoVncUrl = "$Url/vnc.html"

          "CLOUDFLARE_URL=$Url" >> $env:GITHUB_ENV
          "NOVNC_URL=$NoVncUrl" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  noVNC IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host $NoVncUrl
          Write-Host ""
          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 10. Show connection information
      # ============================================================
      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                   WINDOWS READY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "NO-VNC URL:"
          Write-Host $env:NOVNC_URL
          Write-Host ""

          Write-Host "VNC PASSWORD:"
          Write-Host "MyVNC123"
          Write-Host ""

          Write-Host "RDP USER:"
          Write-Host $env:RDP_USER
          Write-Host ""

          Write-Host "RDP PASSWORD:"
          Write-Host $env:RDP_PASSWORD
          Write-Host ""

          Write-Host "============================================================"
          Write-Host "LOCAL VNC  : 127.0.0.1:5900"
          Write-Host "LOCAL WEB  : 127.0.0.1:6080"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 11. Keep the GitHub Windows runner alive
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              WINDOWS SESSION IS RUNNING"
          Write-Host "============================================================"
          Write-Host ""

          while ($true) {

            $Time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$Time] Windows + VNC + noVNC + Cloudflare alive..."

            Start-Sleep -Seconds 300
          }
